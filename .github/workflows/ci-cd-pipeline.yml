name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: 'gcc-webapp-dev'
  AZURE_WEBAPP_PACKAGE_PATH: './publish'
  CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore ./GCCWebApp/GCCWebApp.sln
      
    - name: Build application
      run: dotnet build ./GCCWebApp/GCCWebApp.sln --configuration ${{ env.CONFIGURATION }} --no-restore
      
    - name: Run unit tests
      run: dotnet test ./GCCWebApp/GCCWebApp.RoleBasedUI.Tests/GCCWebApp.RoleBasedUI.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'
        
    - name: Code Analysis
      run: |
        dotnet tool install --global dotnet-format --version 5.1.250801
        dotnet format ./GCCWebApp/GCCWebApp.sln --verify-no-changes --verbosity diagnostic
      continue-on-error: true
      
    - name: Publish application
      run: dotnet publish ./GCCWebApp/GCCWebApp/GCCWebApp.csproj --configuration ${{ env.CONFIGURATION }} --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: webapp-artifact
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security scan
      run: |
        dotnet tool install --global security-scan
        security-scan ./GCCWebApp/GCCWebApp.csproj
      continue-on-error: true
      
    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'GCCWebApp'
        path: './GCCWebApp'
        format: 'HTML'
        args: >
          --enableRetired
          --enableExperimental
      continue-on-error: true
      
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: reports/

  deploy-to-development:
    runs-on: windows-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: Development
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: webapp-artifact
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}
        
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        slot-name: 'development'
        
    - name: Run database migrations
      run: |
        dotnet tool install --global dotnet-ef
        dotnet ef database update --connection "${{ secrets.DEV_CONNECTION_STRING }}" --project ./GCCWebApp/GCCWebApp.csproj
      continue-on-error: true
      
    - name: Health check
      run: |
        $response = Invoke-WebRequest -Uri "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" -UseBasicParsing
        if ($response.StatusCode -ne 200) {
          Write-Error "Health check failed"
          exit 1
        }
      shell: pwsh

  deploy-to-staging:
    runs-on: windows-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: Staging
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: webapp-artifact
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
        
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'gcc-webapp-staging'
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        slot-name: 'staging'
        
    - name: Run database migrations
      run: |
        dotnet tool install --global dotnet-ef
        dotnet ef database update --connection "${{ secrets.STAGING_CONNECTION_STRING }}" --project ./GCCWebApp/GCCWebApp.csproj
      continue-on-error: true
      
    - name: Smoke tests
      run: |
        dotnet test ./GCCWebApp/GCCWebApp.RoleBasedUI.Tests/GCCWebApp.RoleBasedUI.Tests.csproj --filter "Category=SmokeTest" --configuration Release
      continue-on-error: true

  deploy-to-production:
    runs-on: windows-latest
    needs: deploy-to-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: webapp-artifact
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}
        
    - name: Deploy to Azure Web App (Blue-Green)
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'gcc-webapp-prod'
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        slot-name: 'blue'
        
    - name: Run database migrations
      run: |
        dotnet tool install --global dotnet-ef
        dotnet ef database update --connection "${{ secrets.PROD_CONNECTION_STRING }}" --project ./GCCWebApp/GCCWebApp.csproj
      continue-on-error: true
        
    - name: Warm up slot
      run: |
        Start-Sleep -Seconds 30
        Invoke-WebRequest -Uri "https://gcc-webapp-prod-blue.azurewebsites.net/health" -UseBasicParsing
      shell: pwsh
      
    - name: Swap slots
      run: |
        az webapp deployment slot swap --name gcc-webapp-prod --resource-group gcc-prod-rg --slot blue --target-slot production
      
    - name: Post-deployment validation
      run: |
        $response = Invoke-WebRequest -Uri "https://gcc-webapp-prod.azurewebsites.net/health" -UseBasicParsing
        if ($response.StatusCode -ne 200) {
          Write-Error "Production health check failed - initiating rollback"
          az webapp deployment slot swap --name gcc-webapp-prod --resource-group gcc-prod-rg --slot production --target-slot blue
          exit 1
        }
      shell: pwsh