<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Certificate Application Process - Swimlane Diagram
  </text>
  
  <!-- Swimlane Headers -->
  <g id="swimlanes">
    <!-- Company/Partner Lane -->
    <rect x="0" y="60" width="200" height="900" fill="#e8f4f8" stroke="#2980b9" stroke-width="2"/>
    <rect x="0" y="60" width="200" height="40" fill="#3498db"/>
    <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Company/Partner</text>
    
    <!-- System Lane -->
    <rect x="200" y="60" width="300" height="900" fill="#f0f8e8" stroke="#27ae60" stroke-width="2"/>
    <rect x="200" y="60" width="300" height="40" fill="#2ecc71"/>
    <text x="350" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">System (Automated)</text>
    
    <!-- Analyst Lane -->
    <rect x="500" y="60" width="300" height="900" fill="#fff5e8" stroke="#e67e22" stroke-width="2"/>
    <rect x="500" y="60" width="300" height="40" fill="#f39c12"/>
    <text x="650" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">GCC Analyst</text>
    
    <!-- Technical Reviewer Lane -->
    <rect x="800" y="60" width="300" height="900" fill="#f8e8ff" stroke="#8e44ad" stroke-width="2"/>
    <rect x="800" y="60" width="300" height="40" fill="#9b59b6"/>
    <text x="950" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Technical Reviewer</text>
    
    <!-- Manager Lane -->
    <rect x="1100" y="60" width="300" height="900" fill="#ffe8e8" stroke="#c0392b" stroke-width="2"/>
    <rect x="1100" y="60" width="300" height="40" fill="#e74c3c"/>
    <text x="1250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Manager/Approver</text>
  </g>
  
  <!-- Process Steps -->
  <g id="process-steps">
    <!-- Company Actions -->
    <rect x="25" y="120" width="150" height="40" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Login to Portal</text>
    
    <rect x="25" y="180" width="150" height="40" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <text x="100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Select Certificate Type</text>
    
    <rect x="25" y="240" width="150" height="40" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <text x="100" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Complete Application</text>
    
    <rect x="25" y="300" width="150" height="40" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <text x="100" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Upload Documents</text>
    
    <rect x="25" y="360" width="150" height="40" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <text x="100" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Submit Application</text>
    
    <!-- System Actions -->
    <rect x="275" y="420" width="150" height="40" rx="5" fill="#ffffff" stroke="#2ecc71" stroke-width="2"/>
    <text x="350" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Validate Application</text>
    
    <rect x="275" y="480" width="150" height="40" rx="5" fill="#ffffff" stroke="#2ecc71" stroke-width="2"/>
    <text x="350" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Generate App ID</text>
    
    <rect x="275" y="540" width="150" height="40" rx="5" fill="#ffffff" stroke="#2ecc71" stroke-width="2"/>
    <text x="350" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Send Confirmation</text>
    
    <rect x="275" y="600" width="150" height="40" rx="5" fill="#ffffff" stroke="#2ecc71" stroke-width="2"/>
    <text x="350" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Assign to Analyst</text>
    
    <!-- Analyst Actions -->
    <rect x="575" y="660" width="150" height="40" rx="5" fill="#ffffff" stroke="#f39c12" stroke-width="2"/>
    <text x="650" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Initial Review</text>
    
    <polygon points="650,720 700,740 650,760 600,740" fill="#ffffff" stroke="#f39c12" stroke-width="2"/>
    <text x="650" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Complete?</text>
    
    <rect x="575" y="780" width="150" height="40" rx="5" fill="#ffffff" stroke="#f39c12" stroke-width="2"/>
    <text x="650" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Company Eligible</text>
    
    <!-- Technical Review -->
    <rect x="875" y="840" width="150" height="40" rx="5" fill="#ffffff" stroke="#9b59b6" stroke-width="2"/>
    <text x="950" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Technical Review</text>
    
    <polygon points="950,900 1000,920 950,940 900,920" fill="#ffffff" stroke="#9b59b6" stroke-width="2"/>
    <text x="950" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Meets Req?</text>
    
    <!-- Manager Approval -->
    <rect x="1175" y="840" width="150" height="40" rx="5" fill="#ffffff" stroke="#e74c3c" stroke-width="2"/>
    <text x="1250" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Final Review</text>
    
    <polygon points="1250,900 1300,920 1250,940 1200,920" fill="#ffffff" stroke="#e74c3c" stroke-width="2"/>
    <text x="1250" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Approve?</text>
    
    <!-- Final System Actions -->
    <rect x="275" y="840" width="150" height="40" rx="5" fill="#90EE90" stroke="#2ecc71" stroke-width="2"/>
    <text x="350" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Issue Certificate</text>
    
    <rect x="275" y="900" width="150" height="40" rx="5" fill="#90EE90" stroke="#2ecc71" stroke-width="2"/>
    <text x="350" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Update Database</text>
  </g>
  
  <!-- Flow Arrows -->
  <g id="flow-arrows">
    <!-- Vertical flows -->
    <line x1="100" y1="160" x2="100" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="100" y1="220" x2="100" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="100" y1="280" x2="100" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="100" y1="340" x2="100" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Horizontal flows -->
    <line x1="175" y1="380" x2="275" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="350" y1="460" x2="350" y2="480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="350" y1="520" x2="350" y2="540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="350" y1="580" x2="350" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="425" y1="620" x2="575" y2="660" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="650" y1="700" x2="650" y2="720" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="650" y1="760" x2="650" y2="780" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="725" y1="800" x2="875" y2="840" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="1025" y1="860" x2="1175" y2="860" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="1175" y1="920" x2="425" y2="860" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="350" y1="880" x2="350" y2="900" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Return flow for incomplete -->
    <path d="M 600 740 Q 450 740 450 400 L 175 320" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead-red)"/>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 970)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Legend:</text>
    <rect x="80" y="-12" width="30" height="15" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <text x="115" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Process Step</text>
    
    <polygon points="220,-7 235,0 220,7 205,0" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <text x="240" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Decision Point</text>
    
    <line x1="330" y1="-5" x2="360" y2="-5" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="365" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Process Flow</text>
    
    <line x1="450" y1="-5" x2="480" y2="-5" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
    <text x="485" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Return/Rework</text>
    
    <rect x="580" y="-12" width="30" height="15" fill="#90EE90" stroke="#2ecc71" stroke-width="2"/>
    <text x="615" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Final Step</text>
  </g>
  
  <!-- Time indicators -->
  <g id="time-indicators">
    <text x="1320" y="140" font-family="Arial, sans-serif" font-size="10" fill="#666">Day 1</text>
    <text x="1320" y="440" font-family="Arial, sans-serif" font-size="10" fill="#666">Day 2</text>
    <text x="1320" y="680" font-family="Arial, sans-serif" font-size="10" fill="#666">Day 3-5</text>
    <text x="1320" y="860" font-family="Arial, sans-serif" font-size="10" fill="#666">Day 8-10</text>
    <text x="1320" y="920" font-family="Arial, sans-serif" font-size="10" fill="#666">Day 10-12</text>
  </g>
</svg>