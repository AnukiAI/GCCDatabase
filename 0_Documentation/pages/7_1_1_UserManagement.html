<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== CSS CUSTOM PROPERTIES ===== */
        :root {
            /* Colors - Aligned with master design guide */
            --blue-dark: #002B76;
            --blue-primary: #00AEEF;
            --green-primary: #92C83E;
            --green-secondary: #447638;
            --text-color: #333;
            --text-secondary: #666;
            --border-color: #eaeaea;
            --light-gray: #f9f9f9;
            --white: #ffffff;
            --warning: #ff5252;
            --success: #92C83E;
            /* Layout */
            --border-radius-sm: 4px;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            /* Effects */
            --shadow-light: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-medium: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: 0.3s ease;
            /* Typography - 16px minimum */
            --font-size-base: 16px;
            --font-size-sm: 14px;
            --font-size-lg: 18px;
            --font-size-xl: 20px;
        }

        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: var(--light-gray);
            color: var(--text-color);
            line-height: 1.6;
            font-size: var(--font-size-base);
        }

        /* ===== LAYOUT CONTAINERS ===== */
        .container {
            background-color: var(--white);
            padding: var(--space-xl);
            max-width: 1400px;
            margin: var(--space-xl) auto;
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow);
        }

        /* ===== HEADER SECTION ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
            gap: var(--space-md);
        }

        .title-area {
            flex-grow: 1;
        }

        h1 {
            color: var(--blue-dark);
            margin: 0;
            font-size: var(--font-size-xl);
            font-weight: 500;
        }

        .buttons-area {
            display: flex;
            gap: var(--space-sm);
        }

        /* ===== BUTTON STYLES ===== */
        .btn {
            background-color: var(--white);
            color: var(--blue-dark);
            border: 1px solid var(--border-color);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-size: var(--font-size-base);
            font-family: inherit;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            min-height: 44px; /* Touch-friendly minimum */
        }

            .btn:hover {
                background-color: var(--light-gray);
                transform: translateY(-1px);
            }

        .btn-primary {
            background-color: var(--green-primary);
            color: var(--white);
            border: none;
        }

            .btn-primary:hover {
                background-color: #0089BC;
            }

        .btn-add {
            background-color: var(--green-primary);
            color: var(--white);
            border: none;
        }

            .btn-add:hover {
                background-color: var(--green-secondary);
            }

        .btn-delete,
        .btn-edit {
            background: none;
            border: none;
            padding: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--border-radius-sm);
            min-width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 2px;
        }

        .btn-delete {
            color: var(--warning);
        }

        .btn-edit {
            color: var(--blue-primary);
        }

        .btn-delete:hover {
            background-color: rgba(255, 82, 82, 0.1);
        }

        .btn-edit:hover {
            background-color: rgba(0, 174, 239, 0.1);
        }

        /* Actions column specific styling */
        .actions-col {
            text-align: center;
            white-space: nowrap;
            min-width: 80px;
        }

        #user-table td:last-child {
            text-align: center;
            white-space: nowrap;
            padding: 8px 4px;
        }

        /* ===== SEARCH AND FILTER BAR ===== */
        .search-filter-bar {
            display: flex;
            align-items: center;
            background-color: var(--light-gray);
            border-radius: var(--border-radius-sm);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
            gap: var(--space-md);
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            min-width: 200px;
        }

            .search-box input {
                width: 100%;
                padding: var(--space-sm) var(--space-md) var(--space-sm) 35px;
                border-radius: var(--border-radius-sm);
                border: 1px solid var(--border-color);
                background-color: var(--white);
                font-family: inherit;
                font-size: var(--font-size-base);
                box-sizing: border-box;
            }

        .search-icon {
            position: absolute;
            left: var(--space-sm);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .filters {
            display: flex;
            gap: var(--space-md);
            flex-wrap: wrap;
        }

        .filter-select {
            padding: var(--space-sm);
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--white);
            font-family: inherit;
            font-size: var(--font-size-base);
            min-width: 120px;
        }

        /* ===== TABLE STYLES ===== */
        .table-container {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            overflow: hidden;
            margin-bottom: var(--space-lg);
        }

        #user-table {
            width: 100%;
            border-collapse: collapse;
        }

            #user-table th,
            #user-table td {
                padding: var(--space-md);
                text-align: left;
                border-bottom: 1px solid var(--border-color);
            }

            #user-table th {
                background-color: var(--light-gray);
                color: var(--blue-dark);
                font-weight: 500;
                position: sticky;
                top: 0;
                cursor: pointer;
                font-size: var(--font-size-base);
                white-space: nowrap;
            }

                #user-table th .sort-icon {
                    display: inline-block;
                    margin-left: var(--space-xs);
                    font-size: 10px;
                    opacity: 0.6;
                    transition: var(--transition);
                }

                #user-table th.active-sort .sort-icon {
                    opacity: 1;
                }

            #user-table tbody tr:hover {
                background-color: var(--light-gray);
            }

        /* ===== FORM STYLES ===== */
        .text-input {
            border: none;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            padding: var(--space-xs) 2px;
            background: transparent;
            font-family: inherit;
            font-size: var(--font-size-base);
        }

            .text-input:focus {
                outline: none;
                border-bottom-color: var(--blue-primary);
            }

        /* ===== STATUS INDICATORS ===== */
        .status-indicator {
            width: 10px;
            height: 10px;
            display: inline-block;
            border-radius: 50%;
            margin-right: var(--space-xs);
        }

        .status-active {
            background-color: var(--green-primary);
        }

        .status-inactive {
            background-color: #ccc;
        }

        /* ===== MULTI-SELECT STYLES ===== */
        .multi-select-container {
            position: relative;
            width: 100%;
        }

        .multi-select-display {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            padding: var(--space-sm);
            min-height: 44px;
            background-color: var(--white);
            cursor: pointer;
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            align-items: center;
            font-size: var(--font-size-base);
        }

        .multi-select-tag {
            background-color: var(--blue-primary);
            color: var(--white);
            padding: 4px var(--space-sm);
            border-radius: 3px;
            font-size: var(--font-size-sm);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

            .multi-select-tag .remove {
                cursor: pointer;
                font-weight: bold;
                font-size: var(--font-size-base);
            }

        .multi-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 var(--border-radius-sm) var(--border-radius-sm);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: var(--shadow-medium);
        }

        .multi-select-option {
            padding: var(--space-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            transition: var(--transition);
            font-size: var(--font-size-base);
        }

            .multi-select-option:hover {
                background-color: var(--light-gray);
            }

            .multi-select-option input[type="checkbox"] {
                margin: 0;
                width: 16px;
                height: 16px;
                cursor: pointer;
                accent-color: var(--blue-primary);
            }

            .multi-select-option label {
                cursor: pointer;
                flex: 1;
                text-align: left;
                margin: 0;
                font-size: var(--font-size-base);
            }

        /* ===== MODAL STYLES ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: var(--white);
            margin: 5% auto;
            padding: var(--space-xl);
            width: 60%;
            max-width: 600px;
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
        }

        .modal-title {
            color: var(--blue-dark);
            margin: 0;
            font-size: var(--font-size-lg);
            font-weight: 500;
        }

        .modal-close {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }

            .modal-close:hover {
                color: var(--text-color);
            }

        .form-group {
            margin-bottom: var(--space-md);
        }

            .form-group label {
                display: block;
                margin-bottom: var(--space-xs);
                color: var(--text-color);
                font-weight: 500;
                font-size: var(--font-size-base);
            }

            .form-group input,
            .form-group select {
                width: 100%;
                padding: var(--space-sm);
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius-sm);
                font-family: inherit;
                font-size: var(--font-size-base);
                box-sizing: border-box;
                min-height: 44px;
            }

                /* Fix checkbox sizing in forms */
                .form-group input[type="checkbox"] {
                    width: 16px;
                    height: 16px;
                    margin: 0;
                    cursor: pointer;
                    transform: scale(1);
                    accent-color: var(--blue-primary);
                }

            .form-group label input[type="checkbox"] {
                margin-right: var(--space-sm);
                vertical-align: middle;
            }

        .password-help {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-top: var(--space-xs);
            font-style: italic;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: var(--space-md);
            margin-top: var(--space-lg);
        }

        .footer-info {
            text-align: right;
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            margin-top: var(--space-xs);
        }

        .edit-mode {
            background-color: rgba(0, 174, 239, 0.05);
            border-bottom: 2px dashed var(--blue-primary) !important;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 1024px) {
            .container {
                padding: var(--space-lg);
                margin: var(--space-md);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: var(--space-md);
                margin: var(--space-sm);
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .buttons-area {
                width: 100%;
                justify-content: space-between;
            }

            .search-filter-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-box {
                width: 100%;
            }

            .filters {
                width: 100%;
                justify-content: space-between;
            }

            .filter-select {
                flex: 1;
                min-width: auto;
            }

            .modal-content {
                width: 90%;
                margin: 10% auto;
                padding: var(--space-lg);
            }

            /* Mobile adjustments for action buttons */
            .btn-delete, .btn-edit {
                min-width: 32px;
                height: 32px;
                margin: 0 1px;
            }

            /* Table responsive adjustments */
            #user-table {
                font-size: var(--font-size-base);
            }

                #user-table th,
                #user-table td {
                    padding: var(--space-sm);
                }
        }

        @media (max-width: 480px) {
            .container {
                padding: var(--space-sm);
                margin: var(--space-xs);
            }

            .btn {
                font-size: var(--font-size-base);
                padding: var(--space-xs) var(--space-sm);
            }

            h1 {
                font-size: var(--font-size-lg);
            }

            /* Stack filters vertically on very small screens */
            .filters {
                flex-direction: column;
                width: 100%;
            }

            .filter-select {
                width: 100%;
            }
        }

        /* ===== PRINT STYLES ===== */
        @media print {
            .btn, .modal, .search-filter-bar {
                display: none !important;
            }

            .container {
                box-shadow: none;
                border: 1px solid #ccc;
            }

            body {
                background: var(--white);
                color: black;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-area">
                <h1>User Management</h1>
            </div>
            <div class="buttons-area">
                <button id="import-btn" class="btn">
                    <i class="fas fa-upload"></i> Import
                </button>
                <button id="export-btn" class="btn">
                    <i class="fas fa-download"></i> Export
                </button>
                <button id="add-user-btn" class="btn btn-add">
                    <i class="fas fa-plus"></i> Add New User
                </button>
            </div>
        </header>

        <div class="search-filter-bar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search users...">
                <i class="fas fa-search search-icon"></i>
            </div>
            <div class="filters">
                <select id="status-filter" class="filter-select">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
                <select id="role-filter" class="filter-select">
                    <option value="all">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="gcc-user">GCC User</option>
                    <option value="external-user">External User</option>
                </select>
                <select id="company-filter" class="filter-select">
                    <option value="all">All Companies</option>
                    <option value="acme-corp">ACME Corp</option>
                    <option value="tech-solutions">Tech Solutions</option>
                    <option value="global-industries">Global Industries</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table id="user-table">
                <thead>
                    <tr>
                        <th width="18%" data-sort="name">Name <span class="sort-icon">▼</span></th>
                        <th width="20%" data-sort="company">Company <span class="sort-icon">▼</span></th>
                        <th width="22%" data-sort="email">Email <span class="sort-icon">▼</span></th>
                        <th width="12%" data-sort="role">Role <span class="sort-icon">▼</span></th>
                        <th width="10%" data-sort="status">Status <span class="sort-icon">▼</span></th>
                        <th width="12%" data-sort="lastLogin">Last Login <span class="sort-icon">▼</span></th>
                        <th width="6%" class="actions-col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be populated by JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="footer-info">
            <span id="user-count">Showing 0 of 0 users</span>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Add New User</h3>
                <span class="modal-close">&times;</span>
            </div>
            <form id="user-form">
                <input type="hidden" id="user-id">

                <div class="form-group">
                    <label for="user-name">Name</label>
                    <input type="text" id="user-name" required>
                </div>

                <div class="form-group">
                    <label for="user-company">Company</label>
                    <div class="multi-select-container">
                        <div class="multi-select-display" id="company-display">
                            <span style="color: #999;">Select companies...</span>
                        </div>
                        <div class="multi-select-dropdown" id="company-dropdown">
                            <div class="multi-select-option">
                                <input type="checkbox" value="acme-corp" id="company-acme">
                                <label for="company-acme">ACME Corp</label>
                            </div>
                            <div class="multi-select-option">
                                <input type="checkbox" value="tech-solutions" id="company-tech">
                                <label for="company-tech">Tech Solutions</label>
                            </div>
                            <div class="multi-select-option">
                                <input type="checkbox" value="global-industries" id="company-global">
                                <label for="company-global">Global Industries</label>
                            </div>
                            <div class="multi-select-option">
                                <input type="checkbox" value="assa-abloy" id="company-assa">
                                <label for="company-assa">ASSA ABLOY</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="user-partners">Partners</label>
                    <div class="multi-select-container">
                        <div class="multi-select-display" id="partners-display">
                            <span style="color: #999;">Select partners...</span>
                        </div>
                        <div class="multi-select-dropdown" id="partners-dropdown">
                            <div class="multi-select-option">
                                <input type="checkbox" value="amazon" id="partner-amazon">
                                <label for="partner-amazon">Amazon</label>
                            </div>
                            <div class="multi-select-option">
                                <input type="checkbox" value="wayfair" id="partner-wayfair">
                                <label for="partner-wayfair">Wayfair</label>
                            </div>
                            <div class="multi-select-option">
                                <input type="checkbox" value="home-depot" id="partner-depot">
                                <label for="partner-depot">Home Depot</label>
                            </div>
                            <div class="multi-select-option">
                                <input type="checkbox" value="lowes" id="partner-lowes">
                                <label for="partner-lowes">Lowe's</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" required>
                </div>

                <div class="form-group">
                    <label for="user-role">Role</label>
                    <select id="user-role" required>
                        <option value="admin">Admin</option>
                        <option value="gcc-user">GCC User</option>
                        <option value="external-user">External User</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="user-status">Status</label>
                    <select id="user-status" required>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="user-password">Password</label>
                    <input type="password" id="user-password">
                    <div class="password-help">Leave blank to keep current password</div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="require-password-reset"> Require password reset on next login
                    </label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

        // Multi-select functionality
        function initializeMultiSelect() {
            // Company multi-select
            companyDisplay.addEventListener('click', () => {

            });

            // Close dropdowns when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.multi-select-container')) {
                    companyDropdown.style.display = 'none';
                    partnersDropdown.style.display = 'none';
                }
            });

            // Handle checkbox changes
            const companyCheckboxes = companyDropdown.querySelectorAll('input[type="checkbox"]');
            const partnerCheckboxes = partnersDropdown.querySelectorAll('input[type="checkbox"]');

            companyCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', updateCompanyDisplay);
            });

            partnerCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', updatePartnersDisplay);
            });

        function updateCompanyDisplay() {
            const selected = Array.from(companyDropdown.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            if (selected.length === 0) {
                companyDisplay.innerHTML = '<span style="color: #999;">Select companies...</span>';
            } else {
                companyDisplay.innerHTML = selected.map(value =>
                    `<span class="multi-select-tag">
                            ${companyNames[value]}
                            <span class="remove" onclick="removeCompany('${value}')">&times;</span>
                        </span>`
                ).join('');
            }
        }

        function updatePartnersDisplay() {
            const selected = Array.from(partnersDropdown.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            if (selected.length === 0) {
                partnersDisplay.innerHTML = '<span style="color: #999;">Select partners...</span>';
            } else {
                partnersDisplay.innerHTML = selected.map(value =>
                    `<span class="multi-select-tag">
                            ${partnerNames[value]}
                            <span class="remove" onclick="removePartner('${value}')">&times;</span>
                        </span>`
                ).join('');
            }
        }

        function removeCompany(value) {
            const checkbox = companyDropdown.querySelector(`input[value="${value}"]`);
            if (checkbox) {
                checkbox.checked = false;
                updateCompanyDisplay();
            }
        }

        function removePartner(value) {
            const checkbox = partnersDropdown.querySelector(`input[value="${value}"]`);
            if (checkbox) {
                checkbox.checked = false;
                updatePartnersDisplay();
            }

        // Function to format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        // Function to format company/partner lists for display
        function formatList(array, mapping) {
            if (!array || array.length === 0) return '';
            return array.map(item => mapping[item] || item).join(', ');
        }

        // Function to populate the table
        function populateTable(data) {
            userTableBody.innerHTML = '';
            let visibleCount = 0;

            data.forEach(user => {
                const row = document.createElement('tr');
                row.dataset.id = user.id;

                // Name cell
                const nameCell = document.createElement('td');
                nameCell.dataset.field = 'name';
                nameCell.textContent = user.name;
                nameCell.addEventListener('dblclick', () => makeEditable(nameCell, 'text'));
                row.appendChild(nameCell);

                // Company cell
                const companyCell = document.createElement('td');
                companyCell.dataset.field = 'company';
                companyCell.textContent = formatList(user.company, companyNames);
                row.appendChild(companyCell);

                // Email cell
                const emailCell = document.createElement('td');
                emailCell.dataset.field = 'email';
                emailCell.textContent = user.email;
                emailCell.addEventListener('dblclick', () => makeEditable(emailCell, 'email'));
                row.appendChild(emailCell);

                // Role cell
                const roleCell = document.createElement('td');
                roleCell.dataset.field = 'role';
                roleCell.textContent = capitalizeFirstLetter(user.role.replace('-', ' '));
                roleCell.addEventListener('dblclick', () => makeEditable(roleCell, 'select-role'));
                row.appendChild(roleCell);

                // Status cell
                const statusCell = document.createElement('td');
                statusCell.dataset.field = 'status';
                const statusIndicator = document.createElement('span');
                statusIndicator.className = `status-indicator status-${user.status}`;
                statusCell.appendChild(statusIndicator);
                const statusText = document.createTextNode(capitalizeFirstLetter(user.status));
                statusCell.appendChild(statusText);
                statusCell.addEventListener('dblclick', () => makeEditable(statusCell, 'select-status'));
                row.appendChild(statusCell);

                // Last Login cell
                const lastLoginCell = document.createElement('td');
                lastLoginCell.dataset.field = 'lastLogin';
                lastLoginCell.textContent = formatDate(user.lastLogin);
                row.appendChild(lastLoginCell);

                // Actions cell
                const actionsCell = document.createElement('td');
                actionsCell.style.whiteSpace = 'nowrap';
                actionsCell.style.textAlign = 'center';

                // Edit button
                const editButton = document.createElement('button');
                editButton.className = 'btn-edit';
                editButton.innerHTML = '<i class="fas fa-edit"></i>';
                editButton.title = 'Edit';
                editButton.addEventListener('click', () => openEditModal(user));
                actionsCell.appendChild(editButton);

                // Delete button
                const deleteButton = document.createElement('button');
                deleteButton.className = 'btn-delete';
                deleteButton.innerHTML = '<i class="fas fa-trash-alt"></i>';
                deleteButton.title = 'Delete';
                deleteButton.addEventListener('click', () => deleteUser(user.id));
                actionsCell.appendChild(deleteButton);

                row.appendChild(actionsCell);
                userTableBody.appendChild(row);
                visibleCount++;
            });

            // Update the user count
            userCountElement.textContent = `Showing ${visibleCount} of ${users.length} users`;
        }

        // Function to make a cell editable
        function makeEditable(cell, type) {
            const row = cell.parentElement;
            const userId = parseInt(row.dataset.id);
            const field = cell.dataset.field;
            const user = users.find(u => u.id === userId);

            if (!user) return;

            const currentValue = user[field];
            cell.classList.add('edit-mode');

            // Save the original content to restore if cancelled
            const originalContent = cell.innerHTML;

            // Clear the cell
            cell.innerHTML = '';

            let input;

            if (type === 'text' || type === 'email') {
                // Create input element
                input = document.createElement('input');
                input.type = type;
                input.className = 'text-input';
                input.value = currentValue;
                cell.appendChild(input);
                input.focus();
            } else if (type === 'select-role') {
                // Create select for role
                input = document.createElement('select');
                input.className = 'text-input';

                const options = ['admin', 'gcc-user', 'external-user'];
                options.forEach(option => {
                    const optElement = document.createElement('option');
                    optElement.value = option;
                    optElement.text = capitalizeFirstLetter(option.replace('-', ' '));
                    if (option === currentValue) {
                        optElement.selected = true;
                    }
                    input.appendChild(optElement);
                });

                cell.appendChild(input);
                input.focus();
            } else if (type === 'select-status') {
                // Create select for status
                input = document.createElement('select');
                input.className = 'text-input';

                const options = ['active', 'inactive'];
                options.forEach(option => {
                    const optElement = document.createElement('option');
                    optElement.value = option;
                    optElement.text = capitalizeFirstLetter(option);
                    if (option === currentValue) {
                        optElement.selected = true;
                    }
                    input.appendChild(optElement);
                });

                cell.appendChild(input);
                input.focus();
            }

            // Function to save the edit
            const saveEdit = () => {
                const newValue = input.value.trim();

                if (newValue !== '' && newValue !== currentValue) {
                    // Update the user object
                    user[field] = newValue;

                    // Update the cell
                    cell.classList.remove('edit-mode');

                    // Refresh the table
                    applyFiltersAndSort();
                } else {
                    // No change or empty value, restore original
                    cell.innerHTML = originalContent;
                    cell.classList.remove('edit-mode');
                }

                // Remove event listeners
                document.removeEventListener('click', handleClickOutside);
            };

            // Function to handle click outside
            const handleClickOutside = (event) => {
                if (event.target !== input) {
                    saveEdit();
                }
            };

            // Add event listeners
            input.addEventListener('blur', saveEdit);
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    saveEdit();
                } else if (event.key === 'Escape') {
                    cell.innerHTML = originalContent;
                    cell.classList.remove('edit-mode');
                    document.removeEventListener('click', handleClickOutside);
                }
            });

            // Delay adding click outside listener to prevent immediate triggering
            setTimeout(() => {
                document.addEventListener('click', handleClickOutside);
            }, 100);
        }

        // Helper function to capitalize first letter
        function capitalizeFirstLetter(string) {
            return string.charAt(0).toUpperCase() + string.slice(1);
        }

        // Function to initialize the table sortable headers
        function initializeSortableHeaders() {
            const headers = userTable.querySelectorAll('th[data-sort]');

            headers.forEach(header => {
                header.addEventListener('click', () => {
                    const column = header.getAttribute('data-sort');

                    // Toggle sort direction if clicking the same column
                    if (sortColumn === column) {
                        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortColumn = column;
                        sortDirection = 'asc';
                    }

                    // Update header styling
                    headers.forEach(h => {
                        h.classList.remove('active-sort');
                        const icon = h.querySelector('.sort-icon');
                        if (icon) {
                            icon.textContent = '▼';
                            icon.style.opacity = '0.6';
                        }
                    });

                    header.classList.add('active-sort');
                    const sortIcon = header.querySelector('.sort-icon');
                    if (sortIcon) {
                        sortIcon.textContent = sortDirection === 'asc' ? '▼' : '▲';
                        sortIcon.style.opacity = '1';
                    }

                    // Apply filters and sort
                    applyFiltersAndSort();
                });
            });
        }

        // Function to apply filters and sort
        function applyFiltersAndSort() {
            // Apply filters
            const filteredData = getFilteredData();

            // Sort the data
            filteredData.sort((a, b) => {
                let valueA, valueB;

                if (sortColumn === 'company') {
                    valueA = formatList(a.company, companyNames).toLowerCase();
                    valueB = formatList(b.company, companyNames).toLowerCase();
                } else if (sortColumn === 'lastLogin') {
                    valueA = new Date(a.lastLogin).getTime();
                    valueB = new Date(b.lastLogin).getTime();

                    if (sortDirection === 'asc') {
                        return valueA - valueB;
                    } else {
                        return valueB - valueA;
                    }
                } else {
                    valueA = a[sortColumn] ? a[sortColumn].toString().toLowerCase() : '';
                    valueB = b[sortColumn] ? b[sortColumn].toString().toLowerCase() : '';
                }

                if (sortDirection === 'asc') {
                    return valueA.localeCompare(valueB);
                } else {
                    return valueB.localeCompare(valueA);
                }
            });

            populateTable(filteredData);
        }

        // Function to filter the data based on search input and filters
        function getFilteredData() {
            const searchTerm = searchInput.value.toLowerCase();
            const statusValue = statusFilter.value;
            const roleValue = roleFilter.value;
            const companyValue = companyFilter.value;

            return users.filter(user => {
                // Search term filter
                const matchesSearch =
                    searchTerm === '' ||
                    user.name.toLowerCase().includes(searchTerm) ||
                    user.email.toLowerCase().includes(searchTerm) ||
                    user.role.toLowerCase().includes(searchTerm) ||
                    user.status.toLowerCase().includes(searchTerm) ||
                    formatList(user.company, companyNames).toLowerCase().includes(searchTerm) ||
                    formatList(user.partners, partnerNames).toLowerCase().includes(searchTerm);

                // Status filter
                const matchesStatus =
                    statusValue === 'all' ||
                    user.status === statusValue;

                // Role filter
                const matchesRole =
                    roleValue === 'all' ||
                    user.role === roleValue;

                // Company filter
                const matchesCompany =
                    companyValue === 'all' ||
                    (user.company && user.company.includes(companyValue));

                return matchesSearch && matchesStatus && matchesRole && matchesCompany;
            });
        }

        // Function to open the modal for adding a new user
        function openAddModal() {
            modalTitle.textContent = 'Add New User';
            userForm.reset();
            userIdInput.value = '';
            userPasswordInput.required = true;
            requirePasswordResetInput.checked = true;

            // Reset multi-selects
            companyDropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            partnersDropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateCompanyDisplay();
            updatePartnersDisplay();

            modal.style.display = 'block';
        }

        // Function to open the modal for editing a user
        function openEditModal(user) {
            modalTitle.textContent = 'Edit User';
            userIdInput.value = user.id;
            userNameInput.value = user.name;
            userEmailInput.value = user.email;
            userRoleInput.value = user.role;
            userStatusInput.value = user.status;
            userPasswordInput.value = '';
            userPasswordInput.required = false;
            requirePasswordResetInput.checked = user.requirePasswordReset || false;

            // Set company checkboxes
            companyDropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = user.company && user.company.includes(cb.value);
            });
            updateCompanyDisplay();

            // Set partner checkboxes
            partnersDropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = user.partners && user.partners.includes(cb.value);
            });
            updatePartnersDisplay();

            modal.style.display = 'block';
        }

        // Function to close the modal
        function closeModal() {
            modal.style.display = 'none';
            companyDropdown.style.display = 'none';
            partnersDropdown.style.display = 'none';
        }

        // Function to save a user (add or update)
        function saveUser(event) {
            event.preventDefault();

            const userId = userIdInput.value;

            // Get selected companies and partners
            const selectedCompanies = Array.from(companyDropdown.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value);
            const selectedPartners = Array.from(partnersDropdown.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            const userData = {
                name: userNameInput.value,
                company: selectedCompanies,
                partners: selectedPartners,
                email: userEmailInput.value,
                role: userRoleInput.value,
                status: userStatusInput.value,
                requirePasswordReset: requirePasswordResetInput.checked
            };

            if (userPasswordInput.value) {
                userData.password = userPasswordInput.value;
            }

            if (userId) {
                // Update existing user
                const index = users.findIndex(u => u.id.toString() === userId);
                if (index !== -1) {
                    // Keep the password if not changed
                    if (!userData.password) {
                        userData.password = users[index].password;
                    }

                    // Keep the lastLogin
                    userData.lastLogin = users[index].lastLogin;

                    users[index] = {
                        ...users[index],
                        ...userData
                    };
                }
            } else {
                // Add new user
                const newId = users.length > 0 ? Math.max(...users.map(u => u.id)) + 1 : 1;

                // Set current date as lastLogin
                const now = new Date();
                const lastLogin = now.toISOString().slice(0, 16).replace('T', ' ');

                users.push({
                    id: newId,
                    lastLogin: lastLogin,
                    ...userData
                });
            }

            closeModal();
            applyFiltersAndSort();
        }

        // Function to delete a user
        function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                users = users.filter(user => user.id !== id);
                applyFiltersAndSort();
            }
        }

        // Function to handle CSV import
        function importCSV() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.csv';

            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const contents = e.target.result;
                    const lines = contents.split('\n');

                    // Skip header row and process data
                    const newUsers = [];
                    let maxId = users.length > 0 ? Math.max(...users.map(u => u.id)) : 0;

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const fields = line.split(',');
                        if (fields.length < 5) continue;  // Must have at least name, company, email, role, status

                        maxId++;
                        newUsers.push({
                            id: maxId,
                            name: fields[0].trim(),
                            company: fields[1] ? fields[1].trim().split(';') : [],
                            partners: fields[2] ? fields[2].trim().split(';') : [],
                            email: fields[3].trim(),
                            role: fields[4].trim().toLowerCase(),
                            status: fields[5] ? fields[5].trim().toLowerCase() : 'active',
                            lastLogin: fields[6] ? fields[6].trim() : new Date().toISOString().slice(0, 16).replace('T', ' '),
                            password: fields[7] ? fields[7].trim() : 'defaultpassword',
                            requirePasswordReset: fields[8] ? fields[8].trim().toLowerCase() === 'true' : true
                        });
                    }

                    users = [...users, ...newUsers];
                    applyFiltersAndSort();
                };

                reader.readAsText(file);
            });

            fileInput.click();
        }

        // Function to export to CSV
        function exportCSV() {
            const headers = ['Name', 'Company', 'Partners', 'Email', 'Role', 'Status', 'Last Login', 'Password', 'Require Password Reset'];
            const rows = users.map(user => [
                user.name,
                user.company ? user.company.join(';') : '',
                user.partners ? user.partners.join(';') : '',
                user.email,
                user.role,
                user.status,
                user.lastLogin,
                user.password,
                user.requirePasswordReset || false
            ]);

            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(field => `"${field}"`).join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.setAttribute('href', url);
            link.setAttribute('download', 'user_data.csv');
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Event Listeners
        addUserBtn.addEventListener('click', openAddModal);
        importBtn.addEventListener('click', importCSV);
        exportBtn.addEventListener('click', exportCSV);
        modalClose.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        userForm.addEventListener('submit', saveUser);

        // Filter event listeners
        searchInput.addEventListener('input', () => {
            applyFiltersAndSort();
        });

        statusFilter.addEventListener('change', () => {
            applyFiltersAndSort();
        });

        roleFilter.addEventListener('change', () => {
            applyFiltersAndSort();
        });

        companyFilter.addEventListener('change', () => {
            applyFiltersAndSort();
        });

        // Close modal when clicking outside
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        // Initialize
        initializeMultiSelect();
        initializeSortableHeaders();
        applyFiltersAndSort();

        // Make remove functions globally accessible
        window.removeCompany = removeCompany;
        window.removePartner = removePartner;
    </script>
