<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    GCC Database System - Integration Architecture
  </text>
  
  <!-- Central System Core -->
  <g id="core-system">
    <rect x="450" y="300" width="300" height="200" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">GCC Core System</text>
    
    <!-- Core Components -->
    <rect x="470" y="350" width="120" height="30" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1"/>
    <text x="530" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Application Server</text>
    
    <rect x="610" y="350" width="120" height="30" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1"/>
    <text x="670" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Database</text>
    
    <rect x="470" y="390" width="120" height="30" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1"/>
    <text x="530" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">File Storage</text>
    
    <rect x="610" y="390" width="120" height="30" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1"/>
    <text x="670" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Cache Layer</text>
    
    <rect x="470" y="430" width="120" height="30" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1"/>
    <text x="530" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Authentication</text>
    
    <rect x="610" y="430" width="120" height="30" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1"/>
    <text x="670" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">API Gateway</text>
  </g>
  
  <!-- External Users -->
  <g id="external-users">
    <rect x="50" y="100" width="200" height="120" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="150" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">External Users</text>
    
    <rect x="70" y="140" width="160" height="25" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
    <text x="150" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Public Users</text>
    
    <rect x="70" y="170" width="160" height="25" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
    <text x="150" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Partners/Companies</text>
  </g>
  
  <!-- Internal Users -->
  <g id="internal-users">
    <rect x="50" y="250" width="200" height="150" rx="10" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
    <text x="150" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Internal Users</text>
    
    <rect x="70" y="290" width="160" height="25" rx="5" fill="#ffffff" stroke="#d68910" stroke-width="1"/>
    <text x="150" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">GCC Analysts</text>
    
    <rect x="70" y="320" width="160" height="25" rx="5" fill="#ffffff" stroke="#d68910" stroke-width="1"/>
    <text x="150" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">System Administrators</text>
    
    <rect x="70" y="350" width="160" height="25" rx="5" fill="#ffffff" stroke="#d68910" stroke-width="1"/>
    <text x="150" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Management</text>
  </g>
  
  <!-- External Systems -->
  <g id="external-systems">
    <!-- Azure AD B2C -->
    <rect x="950" y="100" width="200" height="80" rx="10" fill="#0078d4" stroke="#005a9e" stroke-width="2"/>
    <text x="1050" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Azure AD B2C</text>
    <text x="1050" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Authentication</text>
    <text x="1050" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">User Management</text>
    
    <!-- Amazon API -->
    <rect x="950" y="200" width="200" height="80" rx="10" fill="#ff9900" stroke="#e88700" stroke-width="2"/>
    <text x="1050" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Amazon API</text>
    <text x="1050" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Product Data</text>
    <text x="1050" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">ASIN Integration</text>
    
    <!-- Google Analytics -->
    <rect x="950" y="300" width="200" height="80" rx="10" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
    <text x="1050" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Google Analytics</text>
    <text x="1050" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Usage Tracking</text>
    <text x="1050" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Performance Metrics</text>
    
    <!-- Testing Labs -->
    <rect x="950" y="400" width="200" height="80" rx="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="1050" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Testing Labs</text>
    <text x="1050" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Test Results</text>
    <text x="1050" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Compliance Data</text>
    
    <!-- Regulatory Systems -->
    <rect x="950" y="500" width="200" height="80" rx="10" fill="#8e44ad" stroke="#7d3c98" stroke-width="2"/>
    <text x="1050" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Regulatory Systems</text>
    <text x="1050" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Compliance Reporting</text>
    <text x="1050" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Standards Updates</text>
  </g>
  
  <!-- Internal Services -->
  <g id="internal-services">
    <!-- Email Service -->
    <rect x="300" y="550" width="180" height="60" rx="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <text x="390" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Email Service</text>
    <text x="390" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Notifications</text>
    
    <!-- Notification Service -->
    <rect x="510" y="550" width="180" height="60" rx="10" fill="#16a085" stroke="#138d75" stroke-width="2"/>
    <text x="600" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Notification Service</text>
    <text x="600" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Alerts & Reminders</text>
    
    <!-- Reporting Engine -->
    <rect x="720" y="550" width="180" height="60" rx="10" fill="#d35400" stroke="#ba4a00" stroke-width="2"/>
    <text x="810" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Reporting Engine</text>
    <text x="810" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Analytics & Reports</text>
  </g>
  
  <!-- ETL Services -->
  <g id="etl-services">
    <rect x="300" y="100" width="280" height="120" rx="10" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <text x="440" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ETL Services</text>
    
    <rect x="320" y="140" width="110" height="25" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="375" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Data Extractor</text>
    
    <rect x="450" y="140" width="110" height="25" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="505" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Data Transformer</text>
    
    <rect x="320" y="175" width="110" height="25" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="375" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Data Loader</text>
    
    <rect x="450" y="175" width="110" height="25" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="505" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">ETL Monitor</text>
  </g>
  
  <!-- Business Partners -->
  <g id="business-partners">
    <rect x="50" y="450" width="200" height="120" rx="10" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <text x="150" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Business Partners</text>
    
    <rect x="70" y="490" width="160" height="25" rx="5" fill="#ffffff" stroke="#7f8c8d" stroke-width="1"/>
    <text x="150" y="507" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">CRM System</text>
    
    <rect x="70" y="520" width="160" height="25" rx="5" fill="#ffffff" stroke="#7f8c8d" stroke-width="1"/>
    <text x="150" y="537" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">ERP Integration</text>
  </g>
  
  <!-- Connection Lines -->
  <g id="connections">
    <!-- User connections -->
    <line x1="250" y1="160" x2="450" y2="350" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="250" y1="325" x2="450" y2="380" stroke="#333" stroke-width="2"/>
    
    <!-- ETL connections -->
    <line x1="440" y1="220" x2="520" y2="300" stroke="#27ae60" stroke-width="3"/>
    
    <!-- External system connections -->
    <line x1="750" y1="380" x2="950" y2="140" stroke="#0078d4" stroke-width="2"/>
    <line x1="750" y1="400" x2="950" y2="240" stroke="#ff9900" stroke-width="2"/>
    <line x1="750" y1="420" x2="950" y2="340" stroke="#4285f4" stroke-width="2"/>
    <line x1="750" y1="440" x2="950" y2="440" stroke="#27ae60" stroke-width="2"/>
    <line x1="750" y1="460" x2="950" y2="540" stroke="#8e44ad" stroke-width="2"/>
    
    <!-- Internal service connections -->
    <line x1="550" y1="500" x2="390" y2="550" stroke="#34495e" stroke-width="2"/>
    <line x1="600" y1="500" x2="600" y2="550" stroke="#16a085" stroke-width="2"/>
    <line x1="650" y1="500" x2="810" y2="550" stroke="#d35400" stroke-width="2"/>
    
    <!-- Partner connections -->
    <line x1="250" y1="510" x2="450" y2="450" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,3"/>
  </g>
  
  <!-- Data Flow Indicators -->
  <g id="flow-indicators">
    <!-- Bidirectional arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
      </marker>
      <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
      </marker>
    </defs>
    
    <!-- Add arrows to lines -->
    <line x1="250" y1="160" x2="450" y2="350" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
    <line x1="440" y1="220" x2="520" y2="300" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="650" width="400" height="120" rx="5" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
    <text x="60" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Integration Types</text>
    
    <line x1="70" y1="690" x2="110" y2="690" stroke="#333" stroke-width="2"/>
    <text x="120" y="695" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Real-time Integration</text>
    
    <line x1="70" y1="710" x2="110" y2="710" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="120" y="715" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Batch/Periodic Integration</text>
    
    <line x1="70" y1="730" x2="110" y2="730" stroke="#27ae60" stroke-width="3"/>
    <text x="120" y="735" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ETL Data Flow</text>
    
    <rect x="270" y="680" width="20" height="15" rx="3" fill="#3498db"/>
    <text x="295" y="692" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Core System</text>
    
    <rect x="270" y="700" width="20" height="15" rx="3" fill="#e74c3c"/>
    <text x="295" y="712" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">User Access</text>
    
    <rect x="270" y="720" width="20" height="15" rx="3" fill="#2ecc71"/>
    <text x="295" y="732" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ETL Service</text>
    
    <rect x="270" y="740" width="20" height="15" rx="3" fill="#95a5a6"/>
    <text x="295" y="752" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Partner System</text>
  </g>
  
  <!-- Security Badge -->
  <g id="security-badge">
    <rect x="500" y="650" width="200" height="120" rx="5" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
    <text x="600" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Security Features</text>
    
    <text x="520" y="695" font-family="Arial, sans-serif" font-size="10" fill="#90EE90">✓ SSL/TLS Encryption</text>
    <text x="520" y="710" font-family="Arial, sans-serif" font-size="10" fill="#90EE90">✓ OAuth 2.0 / OIDC</text>
    <text x="520" y="725" font-family="Arial, sans-serif" font-size="10" fill="#90EE90">✓ API Key Management</text>
    <text x="520" y="740" font-family="Arial, sans-serif" font-size="10" fill="#90EE90">✓ Role-Based Access</text>
    <text x="520" y="755" font-family="Arial, sans-serif" font-size="10" fill="#90EE90">✓ Audit Logging</text>
  </g>
  
  <!-- Performance Metrics -->
  <g id="performance">
    <rect x="750" y="650" width="200" height="120" rx="5" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <text x="850" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Integration Metrics</text>
    
    <text x="770" y="695" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">⚡ API Response: &lt;200ms</text>
    <text x="770" y="710" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">⚡ ETL Processing: 5K/min</text>
    <text x="770" y="725" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">⚡ Uptime: 99.9%</text>
    <text x="770" y="740" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">⚡ Daily Transactions: 50K+</text>
    <text x="770" y="755" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">⚡ Concurrent Users: 500+</text>
  </g>
</svg>