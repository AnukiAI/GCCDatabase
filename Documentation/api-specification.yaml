openapi: 3.0.3
info:
  title: GreenCircle Certified Web Application API
  description: |
    RESTful API for the GreenCircle Certified Web Application.
    This API provides endpoints for managing certificates, companies, products, users, and administrative functions.
  version: 1.0.0
  contact:
    name: GreenCircle API Support
    email: api-support@greencircle.com
  license:
    name: Proprietary
    
servers:
  - url: https://api.greencircle.com/v1
    description: Production server
  - url: https://staging-api.greencircle.com/v1
    description: Staging server
  - url: http://localhost:5000
    description: Development server

security:
  - BearerAuth: []
  - CookieAuth: []

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Certificates
    description: Certificate management operations
  - name: Companies
    description: Company management operations
  - name: Products
    description: Product and category management
  - name: Users
    description: User management operations
  - name: Admin
    description: Administrative functions
  - name: Roles
    description: Role and permission management

paths:
  # Authentication Endpoints
  /account/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate a user and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /account/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Terminate the current user session
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /account/current:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieve information about the currently authenticated user
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Certificate Endpoints
  /certificates:
    get:
      tags:
        - Certificates
      summary: List certificates
      description: Retrieve a paginated list of certificates with optional filtering
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: status
          in: query
          description: Filter by certificate status
          schema:
            type: string
            enum: [active, expired, pending, draft]
        - name: companyId
          in: query
          description: Filter by company ID
          schema:
            type: integer
        - name: productType
          in: query
          description: Filter by product type
          schema:
            type: string
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponse'

    post:
      tags:
        - Certificates
      summary: Create certificate
      description: Create a new certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateRequest'
      responses:
        '201':
          description: Certificate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /certificates/{certificateId}:
    get:
      tags:
        - Certificates
      summary: Get certificate by ID
      description: Retrieve detailed information about a specific certificate
      parameters:
        - $ref: '#/components/parameters/CertificateIdParam'
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateDetailResponse'
        '404':
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Certificates
      summary: Update certificate
      description: Update an existing certificate
      parameters:
        - $ref: '#/components/parameters/CertificateIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCertificateRequest'
      responses:
        '200':
          description: Certificate updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '404':
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Certificates
      summary: Delete certificate
      description: Delete a certificate
      parameters:
        - $ref: '#/components/parameters/CertificateIdParam'
      responses:
        '200':
          description: Certificate deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /certificates/import:
    post:
      tags:
        - Certificates
      summary: Import certificates
      description: Bulk import certificates from CSV or Excel file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or Excel file containing certificate data
      responses:
        '200':
          description: Import results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'

  # Company Endpoints
  /companies:
    get:
      tags:
        - Companies
      summary: List companies
      description: Retrieve a list of all companies
      parameters:
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'

    post:
      tags:
        - Companies
      summary: Create company
      description: Create a new company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'

  /companies/{companyId}:
    get:
      tags:
        - Companies
      summary: Get company by ID
      description: Retrieve detailed information about a specific company
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      responses:
        '200':
          description: Company details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetailResponse'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Companies
      summary: Update company
      description: Update an existing company
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Company updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'

    delete:
      tags:
        - Companies
      summary: Delete company
      description: Delete a company
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
      responses:
        '200':
          description: Company deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # Product Endpoints
  /products/categories:
    get:
      tags:
        - Products
      summary: List product categories
      description: Retrieve hierarchical list of product categories
      responses:
        '200':
          description: List of product categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoryListResponse'

    post:
      tags:
        - Products
      summary: Create product category
      description: Create a new product category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoryResponse'

  # User Management Endpoints
  /admin/users:
    get:
      tags:
        - Users
      summary: List users
      description: Retrieve a list of all users (admin only)
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - name: role
          in: query
          description: Filter by role
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [active, inactive, pending]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

    post:
      tags:
        - Users
      summary: Create user
      description: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /admin/users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve detailed information about a specific user
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'

    put:
      tags:
        - Users
      summary: Update user
      description: Update an existing user
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete a user
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # Role Management Endpoints
  /admin/roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: Retrieve a list of all roles
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'

    post:
      tags:
        - Roles
      summary: Create role
      description: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

  /admin/roles/{roleId}:
    put:
      tags:
        - Roles
      summary: Update role
      description: Update an existing role
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

    delete:
      tags:
        - Roles
      summary: Delete role
      description: Delete a role
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '200':
          description: Role deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /admin/permissions:
    get:
      tags:
        - Roles
      summary: List permissions
      description: Retrieve a list of all available permissions
      responses:
        '200':
          description: List of permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'

  # Admin Configuration Endpoints
  /admin/settings/google-analytics:
    get:
      tags:
        - Admin
      summary: Get Google Analytics settings
      description: Retrieve current Google Analytics configuration
      responses:
        '200':
          description: Google Analytics settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAnalyticsSettings'

    put:
      tags:
        - Admin
      summary: Update Google Analytics settings
      description: Update Google Analytics configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoogleAnalyticsRequest'
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAnalyticsSettings'

  /admin/settings/certificate-types:
    get:
      tags:
        - Admin
      summary: List certificate types
      description: Retrieve all certificate types
      responses:
        '200':
          description: List of certificate types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateTypeListResponse'

    post:
      tags:
        - Admin
      summary: Create certificate type
      description: Create a new certificate type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateTypeRequest'
      responses:
        '201':
          description: Certificate type created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateTypeResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: .AspNetCore.Identity.Application

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSizeParam:
      name: pageSize
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SearchParam:
      name: search
      in: query
      description: Search query string
      schema:
        type: string

    CertificateIdParam:
      name: certificateId
      in: path
      required: true
      description: Certificate ID
      schema:
        type: string

    CompanyIdParam:
      name: companyId
      in: path
      required: true
      description: Company ID
      schema:
        type: integer

    UserIdParam:
      name: userId
      in: path
      required: true
      description: User ID
      schema:
        type: integer

    RoleIdParam:
      name: roleId
      in: path
      required: true
      description: Role ID
      schema:
        type: integer

  schemas:
    # Request Schemas
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@greencircle.com
        password:
          type: string
          format: password
          minLength: 8
        rememberMe:
          type: boolean
          default: false

    CreateCertificateRequest:
      type: object
      required:
        - certificateNumber
        - companyId
        - productName
        - certificateType
      properties:
        certificateNumber:
          type: string
          example: "24-1605"
        companyId:
          type: integer
        productName:
          type: string
        productDescription:
          type: string
        certificateType:
          type: string
        issueDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        attributes:
          type: object
          additionalProperties: true

    UpdateCertificateRequest:
      type: object
      properties:
        productName:
          type: string
        productDescription:
          type: string
        certificateType:
          type: string
        issueDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, expired, pending, draft]
        attributes:
          type: object
          additionalProperties: true

    CreateCompanyRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        url:
          type: string
          format: uri
        address:
          type: string
        phone:
          type: string

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        url:
          type: string
          format: uri
        address:
          type: string
        phone:
          type: string

    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
        companyIds:
          type: array
          items:
            type: integer
        partnerIds:
          type: array
          items:
            type: integer
        requirePasswordReset:
          type: boolean
          default: true

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]
        companyIds:
          type: array
          items:
            type: integer
        partnerIds:
          type: array
          items:
            type: integer

    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 255
        permissions:
          type: array
          items:
            type: string

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 255
        permissions:
          type: array
          items:
            type: string

    CreateProductCategoryRequest:
      type: object
      required:
        - name
        - level
      properties:
        name:
          type: string
          maxLength: 100
        parentId:
          type: integer
          nullable: true
        level:
          type: integer
          minimum: 1
        sortOrder:
          type: integer

    CreateCertificateTypeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        isActive:
          type: boolean
          default: true

    UpdateGoogleAnalyticsRequest:
      type: object
      required:
        - trackingId
      properties:
        trackingId:
          type: string
          pattern: "^UA-\\d{4,10}-\\d{1,4}$|^G-[A-Z0-9]+$"
        isEnabled:
          type: boolean
        trackPageViews:
          type: boolean
        trackEvents:
          type: boolean
        trackConversions:
          type: boolean

    # Response Schemas
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        errors:
          type: array
          items:
            type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: string
        errorCode:
          type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
        expiresIn:
          type: integer
          description: Token expiration time in seconds

    CurrentUserResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanySummary'

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string

    CompanySummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    CertificateListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/CertificateSummary'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    CertificateSummary:
      type: object
      properties:
        id:
          type: string
        certificateNumber:
          type: string
        companyName:
          type: string
        productName:
          type: string
        certificateType:
          type: string
        issueDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        status:
          type: string

    CertificateDetailResponse:
      type: object
      properties:
        id:
          type: string
        certificateNumber:
          type: string
        company:
          $ref: '#/components/schemas/CompanySummary'
        productName:
          type: string
        productDescription:
          type: string
        certificateType:
          type: string
        issueDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        status:
          type: string
        attributes:
          type: object
          additionalProperties: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInfo'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CertificateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CertificateDetailResponse'

    DocumentInfo:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
        uploadedAt:
          type: string
          format: date-time

    CompanyListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyDetail'

    CompanyDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        url:
          type: string
        address:
          type: string
        phone:
          type: string
        certificateCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CompanyDetailResponse:
      allOf:
        - $ref: '#/components/schemas/CompanyDetail'
        - type: object
          properties:
            certificates:
              type: array
              items:
                $ref: '#/components/schemas/CertificateSummary'

    CompanyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CompanyDetail'

    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDetail'

    UserDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        companyNames:
          type: array
          items:
            type: string
        partnerNames:
          type: array
          items:
            type: string
        lastLogin:
          type: string
          format: date-time

    UserDetailResponse:
      allOf:
        - $ref: '#/components/schemas/UserDetail'
        - type: object
          properties:
            permissions:
              type: array
              items:
                type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
