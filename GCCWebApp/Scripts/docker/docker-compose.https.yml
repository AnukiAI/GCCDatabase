version: '3.8'

services:
  gccwebapp:
    build:
      context: .
      dockerfile: Dockerfile.https
    container_name: gcc-webapp-https
    ports:
      - "8443:8081"  # HTTPS
      - "8080:8080"  # HTTP (redirects to HTTPS)
    environment:
      # Core Settings
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_HTTPS_PORT=8081

      # Database (using PostgreSQL in this example)
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=gcc_database;Username=gcc_user;Password=${DB_PASSWORD:-SecurePassword123!}

      # JWT Security
      - Jwt__Key=${JWT_SECRET_KEY:-ThisIsAVeryLongSecretKeyForJwtTokenGenerationAtLeast64CharactersLong123456789}
      - Jwt__Issuer=https://localhost:8443
      - Jwt__Audience=https://localhost:8443

      # Certificate Configuration (Development)
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD:-SecurePassword123!}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx

      # Force HTTPS
      - ASPNETCORE_HTTPS_REDIRECTION=true
      - ASPNETCORE_HSTS=true

      # Data Protection
      - DataProtection__PersistToFileSystem=true

    volumes:
      # Mount certificate directory (for production certificates)
      - ./certs:/https:ro
      # Data persistence
      - app-data:/app/data
      - app-logs:/app/logs
      # Data Protection keys
      - dp-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gcc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: gcc-postgres
    environment:
      - POSTGRES_DB=gcc_database
      - POSTGRES_USER=gcc_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcc_user -d gcc_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gcc-network

  redis:
    image: redis:7-alpine
    container_name: gcc-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisPassword123!}
    volumes:
      - redis-data:/data
    networks:
      - gcc-network

  # Optional: Nginx reverse proxy with Let's Encrypt support
  nginx:
    image: nginx:alpine
    container_name: gcc-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gccwebapp
    networks:
      - gcc-network
    profiles:
      - production

volumes:
  postgres-data:
  redis-data:
  app-data:
  app-logs:
  dp-keys:

networks:
  gcc-network:
    driver: bridge