version: '3.8'

services:
  # GCC Web Application
  gccwebapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gcc-webapp
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mariadb;Port=3306;Database=gcc_database;User=gcc_user;Password=${DB_PASSWORD:-defaultpassword123};
      - Jwt__Key=${JWT_SECRET_KEY:-your-super-secret-jwt-key-min-64-chars-for-security-compliance-here}
      - Jwt__Issuer=GCCWebApp-Docker
      - Jwt__Audience=GCCWebApp-Docker
      - SmtpSettings__Host=${SMTP_HOST:-}
      - SmtpSettings__Port=${SMTP_PORT:-587}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - SmtpSettings__Username=${SMTP_USERNAME:-}
      - SmtpSettings__Password=${SMTP_PASSWORD:-}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL:-noreply@yourdomain.com}
      - SmtpSettings__FromName=GCC Database System
      - Authentication__Enable2FA=${ENABLE_2FA:-true}
      - DatabaseProvider=mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app-logs:/app/logs
    networks:
      - gcc-network

  # MariaDB Database
  mariadb:
    image: mariadb:10.11
    container_name: gcc-mariadb
    environment:
      - MYSQL_DATABASE=gcc_database
      - MYSQL_USER=gcc_user
      - MYSQL_PASSWORD=${DB_PASSWORD:-defaultpassword123}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword123}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gcc-network

  # Redis for caching (optional but recommended for 2FA codes)
  redis:
    image: redis:7-alpine
    container_name: gcc-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gcc-network

volumes:
  mariadb-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local

networks:
  gcc-network:
    driver: bridge