# Docker Compose file for GCC Web Application - TEST Environment
version: '3.8'

services:
  # GCC Web Application - Test Environment
  gccwebapp-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: gcc-webapp:test-${BUILD_NUMBER:-latest}
    container_name: gcc-webapp-test
    hostname: gcc-webapp-test
    ports:
      - "5102:8080"      # HTTP Test Port
      - "5103:8081"      # HTTPS Test Port
    environment:
      # ASP.NET Core Configuration
      - ASPNETCORE_ENVIRONMENT=Test
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      
      # Database Configuration (SQL Server for Test)
      - ConnectionStrings__DefaultConnection=Server=sqlserver-test;Database=GCC_Test;User Id=sa;Password=${DB_SA_PASSWORD:-TestP@ssw0rd123!};TrustServerCertificate=true;MultipleActiveResultSets=true
      
      # JWT Configuration
      - Jwt__Key=${JWT_SECRET_KEY:-test-jwt-secret-key-min-64-chars-for-security-requirements-padding-here}
      - Jwt__Issuer=GCCWebApp-Test-Docker
      - Jwt__Audience=GCCWebApp-Test-Docker
      - Jwt__ExpiryMinutes=60
      
      # Email Configuration
      - SmtpSettings__Host=${SMTP_HOST:-smtp.mailtrap.io}
      - SmtpSettings__Port=${SMTP_PORT:-587}
      - SmtpSettings__EnableSsl=true
      - SmtpSettings__Username=${SMTP_USERNAME:-}
      - SmtpSettings__Password=${SMTP_PASSWORD:-}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL:-test@greencirclecertified.com}
      - SmtpSettings__FromName=GCC Test Environment
      
      # Authentication Settings
      - Authentication__Enable2FA=${ENABLE_2FA:-false}
      - Authentication__EnableTestMode=true
      - Authentication__RequireEmailConfirmation=false
      
      # Security Settings
      - Security__EnableHttpsRedirection=false
      - Security__EnableHsts=false
      - Security__EnableCors=true
      - Security__RequireAuthenticatedUsers=false
      
      # Rate Limiting
      - IpRateLimiting__EnableEndpointRateLimiting=true
      - IpRateLimiting__GeneralRules__0__Endpoint=*/api/*
      - IpRateLimiting__GeneralRules__0__Period=1m
      - IpRateLimiting__GeneralRules__0__Limit=100
      
      # Logging
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft=Information
      - Logging__LogLevel__Microsoft.EntityFrameworkCore=Debug
      
      # Test Specific Settings
      - TestMode__Enabled=true
      - TestMode__AutoSeedData=true
      - TestMode__BypassCaptcha=true
      
    depends_on:
      sqlserver-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - test-app-logs:/app/logs
      - test-app-uploads:/app/wwwroot/uploads
      - test-app-certificates:/app/certificates
      - test-app-dataprotection:/app/DataProtectionKeys
    networks:
      - gcc-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "com.gcc.environment=test"
      - "com.gcc.version=${BUILD_NUMBER:-latest}"
      - "com.gcc.managed-by=docker-compose"

  # SQL Server for Test Environment
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gcc-sqlserver-test
    hostname: sqlserver-test
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_SA_PASSWORD:-TestP@ssw0rd123!}
      - MSSQL_PID=Developer
      - MSSQL_DB=GCC_Test
      - MSSQL_AGENT_ENABLED=true
      - MSSQL_MEMORY_LIMIT_MB=2048
    ports:
      - "1434:1433"  # Different port for test SQL Server
    volumes:
      - test-sqlserver-data:/var/opt/mssql/data
      - test-sqlserver-logs:/var/opt/mssql/log
      - test-sqlserver-secrets:/var/opt/mssql/secrets
      - ./Scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - gcc-test-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_SA_PASSWORD:-TestP@ssw0rd123!}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "com.gcc.environment=test"
      - "com.gcc.component=database"

  # Redis for Test Environment (for caching and session state)
  redis-test:
    image: redis:7-alpine
    container_name: gcc-redis-test
    hostname: redis-test
    ports:
      - "6380:6379"  # Different port for test Redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-TestRedisP@ss123}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfilename "test-appendonly.aof"
    volumes:
      - test-redis-data:/data
    restart: unless-stopped
    networks:
      - gcc-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "com.gcc.environment=test"
      - "com.gcc.component=cache"

  # Nginx Reverse Proxy (Optional - for production-like testing)
  nginx-test:
    image: nginx:alpine
    container_name: gcc-nginx-test
    hostname: nginx-test
    ports:
      - "8090:80"
      - "8091:443"
    volumes:
      - ./nginx/test.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-test:/etc/nginx/ssl:ro
      - test-nginx-logs:/var/log/nginx
    depends_on:
      - gccwebapp-test
    restart: unless-stopped
    networks:
      - gcc-test-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.gcc.environment=test"
      - "com.gcc.component=proxy"

  # Test Data Seeder (Runs once to seed test data)
  test-seeder:
    build:
      context: .
      dockerfile: Dockerfile
    image: gcc-webapp:test-seeder
    container_name: gcc-test-seeder
    command: ["dotnet", "GCCWebApp.dll", "--seed-test-data"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Test
      - ConnectionStrings__DefaultConnection=Server=sqlserver-test;Database=GCC_Test;User Id=sa;Password=${DB_SA_PASSWORD:-TestP@ssw0rd123!};TrustServerCertificate=true
    depends_on:
      sqlserver-test:
        condition: service_healthy
    networks:
      - gcc-test-network
    restart: "no"
    labels:
      - "com.gcc.environment=test"
      - "com.gcc.component=seeder"

volumes:
  # Application volumes
  test-app-logs:
    name: gcc-test-app-logs
    driver: local
  test-app-uploads:
    name: gcc-test-app-uploads
    driver: local
  test-app-certificates:
    name: gcc-test-app-certificates
    driver: local
  test-app-dataprotection:
    name: gcc-test-app-dataprotection
    driver: local
  
  # SQL Server volumes
  test-sqlserver-data:
    name: gcc-test-sqlserver-data
    driver: local
  test-sqlserver-logs:
    name: gcc-test-sqlserver-logs
    driver: local
  test-sqlserver-secrets:
    name: gcc-test-sqlserver-secrets
    driver: local
  
  # Redis volumes
  test-redis-data:
    name: gcc-test-redis-data
    driver: local
  
  # Nginx volumes
  test-nginx-logs:
    name: gcc-test-nginx-logs
    driver: local

networks:
  gcc-test-network:
    name: gcc-test-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16