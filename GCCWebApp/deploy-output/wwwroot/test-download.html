<!DOCTYPE html>
<html>
<head>
    <title>CSV Download Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #results {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            min-height: 100px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>CSV Download Test Page</h1>
    
    <div class="test-section">
        <h2>Test Direct Downloads</h2>
        <button onclick="testDirectDownload('total-active-certs')">Download Total Active Certs</button>
        <button onclick="testDirectDownload('cert-types')">Download Cert Types Table</button>
    </div>

    <div class="test-section">
        <h2>Test Dashboard Download Buttons (Parameterized)</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <button class="stat-download-icon" data-stat-type="total-active-certs" title="Download Data">
                📊 Total Active Certs <i class="fas fa-download"></i>
            </button>
            <button class="stat-download-icon" data-stat-type="companies-with-active-certs" title="Download Data">
                🏢 Companies with Certs <i class="fas fa-download"></i>
            </button>
            <button class="stat-download-icon" data-stat-type="certs-published-last-month" title="Download Data">
                📅 Certs Published Last Month <i class="fas fa-download"></i>
            </button>
        </div>
        <p style="font-size: 12px; color: #666;">Click any button above to test the parameterized download functionality.</p>
    </div>

    <div class="test-section">
        <h2>Test with Fetch API</h2>
        <button onclick="testFetchDownload('total-active-certs')">Fetch Total Active Certs</button>
        <button onclick="testFetchDownload('cert-types')">Fetch Cert Types Table</button>
    </div>

    <div class="test-section">
        <h2>Test with Window Location</h2>
        <button onclick="testWindowLocation('total-active-certs')">Window Location Active Certs</button>
        <button onclick="testWindowLocation('cert-types')">Window Location Cert Types</button>
    </div>

    <div class="test-section">
        <h2>Database Management</h2>
        <button onclick="seedDatabase()" style="background-color: #ff9800;">Seed Database (300 Certificates)</button>
        <button onclick="checkData()">Check Current Data</button>
        <button onclick="testCsvText()">Test CSV Generation (Text)</button>
    </div>

    <div id="results">
        <h3>Results:</h3>
        <pre id="output">Click a button to test CSV download...</pre>
    </div>

    <script>
        const output = document.getElementById('output');

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `\n[${timestamp}] ${message}`;
            console.log(message);
        }

        // Method 1: Direct anchor link
        function testDirectDownload(type) {
            log(`Testing direct download for: ${type}`);
            const link = document.createElement('a');
            const url = type.includes('cert-types') || type.includes('top-companies') 
                ? `/Dashboard/DownloadTable?type=${type}`
                : `/Dashboard/DownloadStat?type=${type}`;
            
            link.href = url;
            link.download = `test-${type}.csv`;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            log(`Direct download triggered for ${url}`);
        }

        // Method 2: Fetch API
        async function testFetchDownload(type) {
            log(`Testing fetch download for: ${type}`);
            const url = type.includes('cert-types') || type.includes('top-companies') 
                ? `/Dashboard/DownloadTable?type=${type}`
                : `/Dashboard/DownloadStat?type=${type}`;
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                
                log(`Fetch response status: ${response.status}`);
                log(`Response headers: ${response.headers.get('content-type')}`);
                
                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `fetch-${type}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(downloadUrl);
                    document.body.removeChild(a);
                    log(`Fetch download successful - File size: ${blob.size} bytes`);
                } else {
                    const text = await response.text();
                    log(`Fetch failed: ${text}`);
                }
            } catch (error) {
                log(`Fetch error: ${error.message}`);
            }
        }

        // Method 3: Window location
        function testWindowLocation(type) {
            log(`Testing window.location for: ${type}`);
            const url = type.includes('cert-types') || type.includes('top-companies') 
                ? `/Dashboard/DownloadTable?type=${type}`
                : `/Dashboard/DownloadStat?type=${type}`;
            
            window.location.href = url;
            log(`Window location set to ${url}`);
        }

        // Database seeding function
        async function seedDatabase() {
            log('Starting database seeding...');
            try {
                const response = await fetch('/Export/SeedDatabase', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`Database seeded successfully: ${JSON.stringify(result, null, 2)}`);
                } else {
                    const error = await response.text();
                    log(`Seeding failed: ${error}`);
                }
            } catch (error) {
                log(`Seeding error: ${error.message}`);
            }
        }

        // Check current data
        async function checkData() {
            log('Checking current database data...');
            try {
                const response = await fetch('/Export/TestData', {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`Current data: ${JSON.stringify(result, null, 2)}`);
                } else {
                    const error = await response.text();
                    log(`Data check failed: ${error}`);
                }
            } catch (error) {
                log(`Data check error: ${error.message}`);
            }
        }

        // Test CSV generation as text
        async function testCsvText() {
            log('Testing CSV generation as text...');
            try {
                const response = await fetch('/Export/TestCsvGeneration?type=certs-published-last-year', {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                
                if (response.ok) {
                    const csvText = await response.text();
                    log(`Generated CSV:\n${csvText}`);
                } else {
                    const error = await response.text();
                    log(`CSV generation failed: ${error}`);
                }
            } catch (error) {
                log(`CSV generation error: ${error.message}`);
            }
        }

        // Event delegation for parameterized download buttons
        document.addEventListener('DOMContentLoaded', () => {
            output.textContent = 'Click a button to test CSV download...\n\nIMPORTANT: First seed the database to get test data!';
            
            // Add event delegation for .stat-download-icon buttons
            document.addEventListener('click', function(event) {
                const button = event.target.closest('.stat-download-icon');
                if (button && button.dataset.statType) {
                    log(`🔽 Dashboard-style download clicked: ${button.dataset.statType}`);
                    downloadStatParameterized(button.dataset.statType);
                }
            });
        });

        // Parameterized download function using TestDownloadNoAuth
        async function downloadStatParameterized(statType) {
            log(`📡 Starting parameterized download for: ${statType}`);
            
            try {
                const url = `/Export/TestDownloadNoAuth?type=${statType}&format=excel`;
                log(`🌐 Making request to: ${url}`);
                
                const response = await fetch(url, {
                    credentials: 'same-origin',
                    headers: {
                        'Accept': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                    }
                });
                
                log(`📊 Response status: ${response.status} ${response.statusText}`);
                
                // Log response headers
                const contentType = response.headers.get('Content-Type');
                const contentLength = response.headers.get('Content-Length');
                const contentDisposition = response.headers.get('Content-Disposition');
                
                log(`📋 Content-Type: ${contentType}`);
                log(`📏 Content-Length: ${contentLength} bytes`);
                log(`📁 Content-Disposition: ${contentDisposition}`);
                
                if (response.ok) {
                    const blob = await response.blob();
                    log(`💾 Blob created, size: ${blob.size} bytes`);
                    
                    // Extract filename from Content-Disposition header or use default
                    let filename = `${statType}-report.xlsx`;
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                        if (filenameMatch) {
                            filename = filenameMatch[1].replace(/['"]/g, '');
                        }
                    }
                    
                    // Create download link
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = downloadUrl;
                    a.download = filename;
                    
                    document.body.appendChild(a);
                    a.click();
                    
                    // Cleanup
                    window.URL.revokeObjectURL(downloadUrl);
                    document.body.removeChild(a);
                    
                    log(`✅ Parameterized download successful! File: ${filename}`);
                } else {
                    const errorText = await response.text();
                    log(`❌ Download failed: ${response.status} - ${errorText}`);
                }
                
            } catch (error) {
                log(`💥 Download error: ${error.message}`);
                console.error('Download error:', error);
            }
        }
    </script>
</body>
</html>
