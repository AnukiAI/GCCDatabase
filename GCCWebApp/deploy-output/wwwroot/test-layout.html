<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Certificate Create Layout</title>
    <link rel="stylesheet" href="/css/certificate-create.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        /* Debug borders */
        .form-grid {
            border: 3px solid red !important;
        }
        .main-form {
            border: 3px solid blue !important;
        }
        .certificate-sidebar {
            border: 3px solid green !important;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div class="admin-header-content">
                <div class="admin-title-section">
                    <p class="admin-page-subtitle">Add a new certificate to the GreenCircle Certified database</p>
                </div>
                <div class="admin-actions-section">
                    <div class="admin-button-group">
                        <a href="#" class="admin-btn admin-btn--secondary">
                            <i class="fas fa-arrow-left"></i> Back to Management
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <div class="admin-content">
            <div class="form-section-header">
                <i class="fas fa-file-certificate"></i>
                <span>Certificate Information</span>
            </div>

            <div class="form-grid">
                <div class="main-form">
                    <div class="form-group">
                        <label>Company <span class="text-danger">*</span></label>
                        <select>
                            <option>Select a company...</option>
                            <option>Company 1</option>
                            <option>Company 2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Certification # <span class="text-danger">*</span></label>
                        <input type="text" placeholder="XX-XXXX">
                    </div>
                    <div class="form-group">
                        <label>Certification Type <span class="text-danger">*</span></label>
                        <select>
                            <option>Select type...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Product Name <span class="text-danger">*</span></label>
                        <select>
                            <option>Select a product...</option>
                        </select>
                    </div>
                </div>

                <div class="certificate-sidebar">
                    <div class="upload-section card-style">
                        <div class="section-icon">
                            <i class="fas fa-image"></i>
                        </div>
                        <h3>Certificate Preview Image</h3>
                        <p>Upload a preview snapshot (PNG/JPG, max 5MB)</p>
                        <div class="upload-placeholder">
                            <i class="fas fa-cloud-upload-alt" style="font-size: 32px; color: #00AEEF;"></i>
                            <div>Click to upload image</div>
                        </div>
                    </div>

                    <div class="tags-section card-style">
                        <div class="section-icon">
                            <i class="fas fa-tags"></i>
                        </div>
                        <h3>Certificate Tags</h3>
                        <div class="tags-group">
                            <label>External Tags</label>
                            <select>
                                <option>Select...</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
