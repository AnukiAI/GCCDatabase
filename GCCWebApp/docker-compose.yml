# Docker Compose file for GCC Web Application

services:
  # GCC Web Application
  gccwebapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gcc-webapp
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=gcc_database;Username=gcc_user;Password=${DB_PASSWORD:-defaultpassword123}
      - Jwt__Key=${JWT_SECRET_KEY:-your-super-secret-jwt-key-min-64-chars-for-security-compliance-here}
      - Jwt__Issuer=GCCWebApp-Docker
      - Jwt__Audience=GCCWebApp-Docker
      - SmtpSettings__Host=${SMTP_HOST:-}
      - SmtpSettings__Port=${SMTP_PORT:-587}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - SmtpSettings__Username=${SMTP_USERNAME:-}
      - SmtpSettings__Password=${SMTP_PASSWORD:-}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL:-noreply@yourdomain.com}
      - SmtpSettings__FromName=GCC Database System
      - Authentication__Enable2FA=${ENABLE_2FA:-true}
      - DatabaseProvider=postgresql
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app-logs:/app/logs
    networks:
      - gcc-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gcc-postgres
    environment:
      - POSTGRES_DB=gcc_database
      - POSTGRES_USER=gcc_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-defaultpassword123}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcc_user -d gcc_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gcc-network

  # Redis for caching (optional but recommended for 2FA codes)
  redis:
    image: redis:7-alpine
    container_name: gcc-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gcc-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local

networks:
  gcc-network:
    driver: bridge