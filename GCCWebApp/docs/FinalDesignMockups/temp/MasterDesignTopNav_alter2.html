<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenCircle Company Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-green: #447638;
            --light-green: #92C83E;
            --light-blue: #00AEEF;
            --dark-blue: #002B76;
            --light-gray: #f9f9f9;
            --border-color: #ddd;
            --text-color: #333;
        }

        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            margin: 0;
            background-color: var(--light-gray);
            color: var(--text-color);
        }

        /* HEADER */
        .header-top {
            background-color: var(--light-green);
            color: var(--dark-green);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-img {
            background-color: white;
            color: var(--dark-green);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .nav-bar {
            background-color: white;
            padding: 10px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            gap: 20px;
            padding: 0;
            margin: 0;
        }

            .nav-menu li a {
                text-decoration: none;
                color: var(--dark-green);
                font-weight: 600;
            }

                .nav-menu li a.active {
                    color: var(--dark-blue);
                    border-bottom: 3px solid var(--light-blue);
                    padding-bottom: 3px;
                }

        /* SEARCH */
        .search-box input {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            width: 250px;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--dark-green);
            margin-top: 0;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            margin-right: 10px;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-primary {
            background-color: var(--light-green);
            color: white;
            font-weight: bold;
        }

            .btn-primary:hover {
                background-color: var(--dark-green);
            }

        .btn-outline {
            background-color: white;
            border: 2px solid var(--light-blue);
            color: var(--dark-blue);
        }

            .btn-outline:hover {
                background-color: var(--light-blue);
                color: white;
            }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: var(--dark-green);
            color: white;
            cursor: pointer;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) {
            background-color: #f3f8f3;
        }

        .sort-icon {
            margin-left: 8px;
        }

        /* ACTION BUTTONS */
        .btn-edit, .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-right: 5px;
        }

        .btn-edit {
            color: var(--light-blue);
        }

        .btn-delete {
            color: red;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            position: relative;
            animation: fadeIn 0.3s;
        }

        .modal-close {
            position: absolute;
            right: 15px;
            top: 10px;
            cursor: pointer;
            font-size: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--light-blue);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

            .toast.show {
                opacity: 1;
            }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="logo-area">
            <div class="logo-img">GC</div>
            GreenCircle Company Management
        </div>
    </div>

    <div class="nav-bar">
        <ul class="nav-menu">
            <li><a href="#" class="active">Companies</a></li>
            <li><a href="#">Certificates</a></li>
            <li><a href="#">Products</a></li>
        </ul>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search companies...">
        </div>
    </div>

    <div class="container">
        <h1>Company Management</h1>
        <button class="btn btn-outline" id="import-btn">Import</button>
        <button class="btn btn-outline" id="export-btn">Export</button>
        <button class="btn btn-primary" id="add-company-btn">+ Add Company</button>

        <table id="company-table">
            <thead>
                <tr>
                    <th data-sort="name">Name <i class="fas fa-sort sort-icon"></i></th>
                    <th data-sort="email">Email <i class="fas fa-sort sort-icon"></i></th>
                    <th data-sort="phone">Phone <i class="fas fa-sort sort-icon"></i></th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <p id="company-count">Showing 0 of 0 companies</p>
    </div>

    <div class="modal" id="company-modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 id="modal-title">Add New Company</h3>
            <form id="company-form">
                <input type="hidden" id="company-id">
                <div class="form-group">
                    <input type="text" id="company-name" placeholder="Company Name" required>
                    <input type="email" id="company-email" placeholder="Email">
                    <input type="text" id="company-phone" placeholder="Phone">
                    <input type="url" id="company-website" placeholder="Website">
                    <input type="text" id="company-address" placeholder="Address">
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast">Success!</div>

    <script>
        let companies = [];

        // Load from Local Storage
        function loadFromLocal() {
            const saved = localStorage.getItem('companies');
            if (saved) {
                companies = JSON.parse(saved);
            } else {
                companies = [
                    { id: 1, name: 'Acme Corporation', email: 'info@acme.com', phone: '', website: 'https://www.acme.com', address: '123 Main St' },
                    { id: 2, name: 'Globex Industries', email: 'sales@globex.com', phone: '(555) 222-3333', website: 'https://www.globex.com', address: '456 Tech Drive' }
                ];
            }
        }

        function saveToLocal() {
            localStorage.setItem('companies', JSON.stringify(companies));
        }

        // Elements
        const tableBody = document.querySelector('#company-table tbody');
        const searchInput = document.getElementById('search-input');
        const countText = document.getElementById('company-count');

        const addBtn = document.getElementById('add-company-btn');
        const importBtn = document.getElementById('import-btn');
        const exportBtn = document.getElementById('export-btn');

        const modal = document.getElementById('company-modal');
        const modalTitle = document.getElementById('modal-title');
        const closeModalBtn = document.querySelector('.modal-close');
        const companyForm = document.getElementById('company-form');
        const companyIdInput = document.getElementById('company-id');
        const nameInput = document.getElementById('company-name');
        const emailInput = document.getElementById('company-email');
        const phoneInput = document.getElementById('company-phone');
        const websiteInput = document.getElementById('company-website');
        const addressInput = document.getElementById('company-address');
        const toast = document.getElementById('toast');

        let sortColumn = 'name';
        let sortDirection = 'asc';

        // Show toast
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Render Table
        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach(c => {
                const row = document.createElement('tr');

                row.innerHTML = `
                <td>${c.name}</td>
                <td>${c.email}</td>
                <td>${c.phone}</td>
                <td>
                    <button class="btn-edit" aria-label="Edit" onclick="editCompany(${c.id})"><i class="fas fa-edit"></i></button>
                    <button class="btn-delete" aria-label="Delete" onclick="deleteCompany(${c.id})"><i class="fas fa-trash-alt"></i></button>
                </td>
            `;
                tableBody.appendChild(row);
            });

            countText.textContent = `Showing ${data.length} of ${companies.length} companies`;
        }

        // Filter and sort
        function getFilteredSorted() {
            const search = searchInput.value.toLowerCase();
            let result = companies.filter(c =>
                [c.name, c.email, c.phone, c.website, c.address]
                    .some(v => v && v.toLowerCase().includes(search))
            );

            result.sort((a, b) => {
                const valA = (a[sortColumn] || '').toLowerCase();
                const valB = (b[sortColumn] || '').toLowerCase();
                return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });

            return result;
        }

        // Update table
        function updateTable() {
            const data = getFilteredSorted();
            renderTable(data);
        }

        // Sorting
        document.querySelectorAll('#company-table th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const column = th.getAttribute('data-sort');
                if (sortColumn === column) {
                    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    sortColumn = column;
                    sortDirection = 'asc';
                }
                document.querySelectorAll('#company-table th').forEach(h => h.classList.remove('active-sort'));
                th.classList.add('active-sort');
                updateTable();
            });
        });

        // Modal
        function openModal(title, company = {}) {
            modalTitle.textContent = title;
            companyIdInput.value = company.id || '';
            nameInput.value = company.name || '';
            emailInput.value = company.email || '';
            phoneInput.value = company.phone || '';
            websiteInput.value = company.website || '';
            addressInput.value = company.address || '';
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // CRUD
        addBtn.addEventListener('click', () => openModal('Add New Company'));

        function editCompany(id) {
            const company = companies.find(c => c.id === id);
            if (company) openModal('Edit Company', company);
        }

        function deleteCompany(id) {
            if (confirm('Delete this company?')) {
                companies = companies.filter(c => c.id !== id);
                saveToLocal();
                updateTable();
                showToast('Company deleted');
            }
        }

        // Save
        companyForm.addEventListener('submit', e => {
            e.preventDefault();
            const id = companyIdInput.value;
            const data = {
                name: nameInput.value,
                email: emailInput.value,
                phone: phoneInput.value,
                website: websiteInput.value,
                address: addressInput.value
            };

            if (id) {
                const index = companies.findIndex(c => c.id == id);
                if (index !== -1) {
                    companies[index] = { ...companies[index], ...data };
                    showToast('Company updated');
                }
            } else {
                const newId = companies.length ? Math.max(...companies.map(c => c.id)) + 1 : 1;
                companies.push({ id: newId, ...data });
                showToast('Company added');
            }

            saveToLocal();
            updateTable();
            closeModal();
        });

        // Close modal
        closeModalBtn.addEventListener('click', closeModal);
        window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
        window.addEventListener('click', e => { if (e.target === modal) closeModal(); });

        // Search
        searchInput.addEventListener('input', updateTable);

        // CSV Import
        importBtn.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = () => {
                    const lines = reader.result.split(/\r?\n/);
                    let maxId = companies.length ? Math.max(...companies.map(c => c.id)) : 0;

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const match = [...line.matchAll(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)];
                        const fields = match.map(m => m[0].replace(/^"|"$/g, ''));
                        if (fields.length >= 3) {
                            maxId++;
                            companies.push({
                                id: maxId,
                                name: fields[0],
                                email: fields[1],
                                phone: fields[2],
                                website: fields[3] || '',
                                address: fields[4] || ''
                            });
                        }
                    }

                    saveToLocal();
                    updateTable();
                    showToast('CSV imported');
                };
                reader.readAsText(file);
            };
            input.click();
        });

        // CSV Export
        exportBtn.addEventListener('click', () => {
            const headers = ['Name', 'Email', 'Phone', 'Website', 'Address'];
            const rows = companies.map(c => [
                c.name, c.email, c.phone, c.website, c.address
            ].map(v => `"${v || ''}"`));

            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\\n');
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = 'companies.csv';
            link.click();
        });

        // Initialize
        loadFromLocal();
        updateTable();
    </script>
