<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Upload</title>
    <style>
        :root {
            --dark-green: #447638;
            --light-green: #92C83E;
            --light-blue: #00AEEF;
            --dark-blue: #002B76;
            --bg-color: #f9f9f9;
        }

        body {
            font-family: 'Century Gothic', sans-serif;
            background-color: var(--bg-color);
            padding: 2rem;
            margin: 0;
        }

        .upload-container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 2rem;
            border: 2px solid var(--dark-green);
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: var(--dark-blue);
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: normal;
            color: black;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .dropzone {
            border: 2px dashed var(--light-blue);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            color: var(--dark-blue);
            background-color: #e8f8fc;
            margin-top: 1rem;
            transition: background-color 0.3s;
            cursor: pointer;
        }

            .dropzone.dragover {
                background-color: #d0f0ff;
            }

        .file-list {
            margin-top: 1rem;
            color: var(--dark-green);
            font-weight: bold;
        }

        .submit-btn {
            background-color: var(--light-green);
            color: #fff;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            display: block;
            margin: 2rem auto 0;
        }

        .file-preview {
            margin-top: 1rem;
            background: #f0fff0;
            border: 1px solid var(--light-green);
            padding: 1rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

            .file-preview .file-info {
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .file-preview span {
                color: var(--dark-green);
            }

        .delete-btn {
            background-color: #ff5252;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <div class="form-group">
            <label for="certificateName">Certificate Name</label>
            <input type="text" id="certificateName" placeholder="Enter certificate name" />
        </div>
        <div class="form-group">
            <label for="certType">Certification Type</label>
            <select id="certType" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
                <option value="">Select type</option>
                <option value="ISO">ISO</option>
                <option value="LEED">LEED</option>
                <option value="Energy Star">Energy Star</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="certificateUpload">Upload PDF</label>
            <div class="dropzone" id="dropzone">
                Drag and drop your certificate here or click to select
                <input type="file" id="certificateUpload" accept="application/pdf" style="display: none" />
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
        <button class="submit-btn">Upload & Save</button>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('certificateUpload');
        const fileList = document.getElementById('fileList');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFileUpload(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFileUpload(fileInput.files);
        });

        function handleFileUpload(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.type === 'application/pdf') {
                    fileList.innerHTML = `
                    <div class="file-preview">
                      <div class="file-info">
                        <span>📄 ${file.name}</span>
                      </div>
                      <button class="delete-btn" onclick="removeFile()">Delete</button>
                    </div>
                  `;
                } else {
                    fileList.innerHTML = '<span style="color: red;">Please upload a valid PDF file.</span>';
                }
            }
        }

        function removeFile() {
            fileInput.value = '';
            fileList.innerHTML = '';
        }
    </script>
</body>
</html>
