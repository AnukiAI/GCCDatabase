<!-- Partners Management Content -->
<!-- This content is designed to be included in the master layout -->

<div class="container">
    <header>
        <div class="title-area">
            <h1>Partners Management</h1>
        </div>
        <div class="buttons-area">
            <button id="import-btn" class="btn btn-outline">
                <i class="fas fa-upload"></i> Import
            </button>
            <button id="export-btn" class="btn btn-outline">
                <i class="fas fa-download"></i> Export
            </button>
            <button id="add-partner-btn" class="btn btn-add">
                <i class="fas fa-plus"></i> Add New Partner
            </button>
        </div>
    </header>

    <div class="search-filter-bar">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search partners...">
            <i class="fas fa-search search-icon"></i>
        </div>
    </div>

    <div class="table-container">
        <table id="partners-table">
            <thead>
                <tr>
                    <th width="60%" data-sort="name">Partner Name <span class="sort-icon">&#9660;</span></th>
                    <th width="40%" class="actions-col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Table rows will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
    <div class="footer-info">
        <span id="partner-count">Showing 0 of 0 partners</span>
    </div>
</div>

<script src="js/partners.js"></script>
