# =====================================================
# Nginx Configuration for GCC Web Application
# Add this to Plesk: Domain → Apache & nginx Settings
# → Additional nginx directives
# =====================================================

# Proxy to .NET Core application running on localhost:5000
location / {
    proxy_pass http://localhost:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Timeouts for long-running requests (PDF generation, etc.)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Buffer settings
    proxy_buffering off;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Max upload size (for certificate uploads)
    client_max_body_size 50M;
}

# Serve static files directly from wwwroot (better performance)
location ~* ^/(css|js|lib|images|fonts|favicon\.ico|robots\.txt)/ {
    root /var/www/vhosts/yourdomain.com/httpdocs/wwwroot;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Handle uploaded files
location /uploads/ {
    alias /var/www/vhosts/yourdomain.com/httpdocs/wwwroot/uploads/;
    expires 7d;
    add_header Cache-Control "public";
}

# API endpoints with specific handling
location /api/ {
    proxy_pass http://localhost:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # API-specific settings
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;

    # CORS headers (if needed)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
}

# WebSocket support for SignalR (if used)
location /hubs/ {
    proxy_pass http://localhost:5000/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Health check endpoint
location /health {
    proxy_pass http://localhost:5000/health;
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Swagger documentation (if enabled)
location /swagger {
    proxy_pass http://localhost:5000/swagger;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Hide server tokens
server_tokens off;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/javascript application/x-javascript application/x-font-ttf application/vnd.ms-fontobject font/opentype;

# Optional: Force HTTPS (uncomment after SSL is configured)
# if ($scheme != "https") {
