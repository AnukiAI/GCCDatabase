<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== CSS CUSTOM PROPERTIES - Master Design Guide ===== */
        :root {
            /* Colors - Exact match to Master Design Guide */
            --blue-dark: #002B76;
            --blue-primary: #00AEEF;
            --green-primary: #92C83E;
            --green-secondary: #447638;
            --green-light: #92C83E;
            --green-lighter: #D4F084;
            --green-pale: #E8F7B8;
            --text-color: #333;
            --text-secondary: #666;
            --border-color: #eaeaea;
            --light-gray: #f9f9f9;
            --medium-gray: #DDDDDD;
            --dark-gray: #333333;
            --white: #ffffff;
            --warning: #ff5252;
            --success: #92C83E;
            --header-color: #FCFDEB;
            /* Layout - 8px grid system */
            --border-radius-sm: 4px;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            /* Font sizes - Minimum 16px as per guide */
            --font-size-base: 16px;
            --font-size-small: 16px;
            --font-size-large: 18px;
            --font-size-xl: 20px;
            /* Touch targets - 44px minimum */
            --touch-target-min: 44px;
            /* Effects - Match Master Design Guide */
            --shadow-light: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-medium: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-strong: 0 8px 16px rgba(0, 0, 0, 0.2);
            --transition-fast: 0.15s ease;
            --transition: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: var(--light-gray);
            color: var(--text-color);
            font-size: var(--font-size-base);
            line-height: 1.6;
        }

        /* ===== LAYOUT CONTAINERS ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-lg);
        }

        .page-content {
            background-color: var(--white);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            padding: var(--space-xl);
            margin: var(--space-lg) 0;
        }

        /* ===== HEADER SECTION ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-xl);
            padding-bottom: var(--space-lg);
        }

        .title-area h1 {
            color: var(--blue-dark);
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }

        .buttons-area {
            display: flex;
            gap: var(--space-sm);
        }

        /* ===== BUTTON STYLES - Master Design Guide ===== */
        .btn {
            padding: var(--space-sm) var(--space-md);
            border-radius: 6px;
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            font-size: var(--font-size-base);
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            transition: var(--transition);
            border: 1px solid var(--border-color);
            text-decoration: none;
            min-height: var(--touch-target-min);
            background-color: transparent;
            color: var(--text-secondary);
        }

            .btn:hover {
                background-color: #f7f7f7;
            }

        .btn-primary {
            background-color: var(--blue-primary);
            color: var(--white);
            border: none;
        }

            .btn-primary:hover {
                background-color: #0095d8;
            }

        .btn-add {
            background-color: var(--green-primary);
            color: var(--white);
            border: none;
        }

            .btn-add:hover {
                background-color: var(--green-secondary);
            }

        /* ===== SEARCH & FILTER BAR ===== */
        .search-filter-bar {
            display: flex;
            align-items: center;
            background-color: var(--light-gray);
            border-radius: var(--border-radius-sm);
            padding: var(--space-sm);
            margin-bottom: var(--space-md);
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            min-width: 200px;
        }

            .search-box input {
                width: 100%;
                padding: var(--space-sm) var(--space-sm) var(--space-sm) 36px;
                border-radius: var(--border-radius-sm);
                border: 1px solid var(--border-color);
                background-color: var(--white);
                font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
                font-size: var(--font-size-base);
                box-sizing: border-box;
            }

        .search-icon {
            position: absolute;
            left: var(--space-sm);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }
        /* ===== TABLE CONTAINER ===== */
        .table-container {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        /* ===== TABLE STYLES - Master Design Guide ===== */
        #company-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--white);
            font-size: var(--font-size-base);
        }

            #company-table th {
                background-color: var(--light-gray);
                color: var(--blue-dark);
                font-weight: 500;
                position: sticky;
                top: 0;
                z-index: 10;
                cursor: pointer;
                user-select: none;
                transition: var(--transition-fast);
                border-bottom: 2px solid var(--border-color);
                text-align: left;
                padding: var(--space-md);
                min-height: 48px;
                font-size: var(--font-size-base);
            }

                #company-table th:hover {
                    background-color: var(--medium-gray);
                }

        .sort-icon {
            opacity: 0.5;
            margin-left: var(--space-xs);
            font-size: var(--font-size-base);
        }

        .active-sort .sort-icon {
            opacity: 1;
        }

        #company-table tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition-fast);
            min-height: 48px;
        }

            #company-table tbody tr:hover {
                background-color: var(--light-gray);
            }

        #company-table td {
            padding: var(--space-md);
            vertical-align: middle;
            min-height: 48px;
            font-size: var(--font-size-base);
        }

        /* ===== INLINE EDITING STYLES - Partners Pattern ===== */
        .company-edit-row .company-name,
        .company-edit-row .company-email,
        .company-edit-row .company-url {
            display: none;
        }

        .company-name-edit,
        .company-email-edit,
        .company-url-edit {
            display: none;
        }

        .company-edit-row .company-name-edit,
        .company-edit-row .company-email-edit,
        .company-edit-row .company-url-edit {
            display: block;
        }

        /* Add row styles - consistent with edit rows */
        .company-add-row {
            display: none;
        }

            .company-add-row.active {
                display: table-row;
            }

        .company-edit-input {
            width: 100%;
            border: 1px solid var(--border-color);
            background: var(--white);
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            font-size: var(--font-size-base);
            padding: var(--space-sm);
            border-radius: var(--border-radius-sm);
            outline: none;
        }

            .company-edit-input:focus {
                border-color: var(--blue-primary);
                box-shadow: 0 0 0 2px rgba(0, 174, 239, 0.2);
            }

        .action-buttons {
            display: flex;
            gap: var(--space-sm);
        }

        .company-edit-actions {
            display: none;
            gap: var(--space-xs);
        }

        .company-edit-row .action-buttons {
            display: none;
        }

        .company-edit-row .company-edit-actions {
            display: flex;
        }

        /* Add row actions always visible */
        .company-add-row .company-edit-actions {
            display: flex;
        }

        .company-btn-save,
        .company-btn-cancel {
            padding: var(--space-sm);
            border: none;
            border-radius: var(--border-radius-sm);
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: var(--transition-fast);
            min-height: var(--touch-target-min);
            min-width: var(--touch-target-min);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .company-btn-save {
            background-color: var(--green-primary);
            color: var(--white);
        }

            .company-btn-save:hover {
                background-color: var(--green-secondary);
            }

        .company-btn-cancel {
            background-color: var(--warning);
            color: var(--white);
        }

            .company-btn-cancel:hover {
                background-color: #d44332;
            }

        /* ===== ACTIONS COLUMN ===== */
        .actions-col {
            width: 100px !important;
            text-align: right !important;
        }

        .actions-cell {
            display: flex;
            justify-content: flex-end;
            gap: var(--space-sm);
            align-items: center;
        }

        .btn-edit, .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            font-size: var(--font-size-base);
            padding: var(--space-sm);
            border-radius: var(--border-radius-sm);
            transition: var(--transition-fast);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: var(--touch-target-min);
            min-width: var(--touch-target-min);
        }

        .btn-edit {
            color: var(--blue-primary);
        }

            .btn-edit:hover {
                background-color: rgba(0, 174, 239, 0.1);
            }

        .btn-delete {
            color: var(--warning);
        }

            .btn-delete:hover {
                background-color: rgba(255, 82, 82, 0.1);
            }

        /* ===== URL LINKS ===== */
        .url-link {
            color: var(--blue-primary);
            text-decoration: none;
        }

            .url-link:hover {
                text-decoration: underline;
            }

        /* ===== MODAL STYLES - Master Design Guide ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: var(--white);
            margin: 10% auto;
            padding: var(--space-xl);
            width: 50%;
            max-width: 500px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-strong);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
        }

        .modal-title {
            color: var(--blue-dark);
            margin: 0;
            font-size: var(--font-size-large);
            font-weight: 500;
        }

        .modal-close {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-secondary);
        }

            .modal-close:hover {
                color: var(--text-color);
            }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: var(--space-md);
        }

            .form-group label {
                display: block;
                margin-bottom: var(--space-xs);
                color: var(--text-color);
                font-size: var(--font-size-base);
                font-weight: 500;
            }

            .form-group input {
                width: 100%;
                padding: var(--space-sm);
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius-sm);
                font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
                font-size: var(--font-size-base);
                box-sizing: border-box;
                min-height: var(--touch-target-min);
            }

                .form-group input:focus {
                    outline: none;
                    border-color: var(--blue-primary);
                    box-shadow: 0 0 0 2px rgba(0, 174, 239, 0.2);
                }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: var(--space-sm);
            margin-top: var(--space-lg);
        }

        /* ===== FOOTER INFO ===== */
        .footer-info {
            text-align: right;
            color: var(--text-secondary);
            font-size: var(--font-size-base);
            margin-top: var(--space-xs);
        }

        /* ===== RESPONSIVE DESIGN - Master Design Guide ===== */
        @media (max-width: 768px) {
            .container {
                padding: var(--space-md);
            }

            .page-content {
                margin: var(--space-sm) 0;
                padding: var(--space-lg);
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-md);
            }

            .buttons-area {
                width: 100%;
                justify-content: space-between;
            }

            .search-filter-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-md);
            }

            .search-box {
                width: 100%;
            }

            .modal-content {
                width: 90%;
                margin: 20% auto;
                padding: var(--space-lg);
            }

            #company-table th,
            #company-table td {
                padding: var(--space-sm);
            }
        }

        @media (max-width: 480px) {
            .page-content {
                padding: var(--space-md);
                margin: var(--space-xs) 0;
            }

            .title-area h1 {
                font-size: var(--font-size-large);
            }

            .buttons-area {
                flex-direction: column;
                width: 100%;
                gap: var(--space-sm);
            }

            .btn {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- [AI Update: 2025-07-15] Updated Company grid to match Master Design Guide with proper container structure, 16px minimum fonts, and 44px touch targets -->
    <div class="container">
        <div class="page-content">
            <header>
                <div class="title-area">
                    <h1>Company Management</h1>
                </div>
                <div class="buttons-area">
                    <button id="import-btn" class="btn">
                        <i class="fas fa-upload"></i> Import
                    </button>
                    <button id="export-btn" class="btn">
                        <i class="fas fa-download"></i> Export
                    </button>
                    <button id="add-company-btn" class="btn btn-add" onclick="showAddRow()">
                        <i class="fas fa-plus"></i> Add New Company
                    </button>
                </div>
            </header>

            <div class="search-filter-bar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search companies...">
                    <i class="fas fa-search search-icon"></i>
                </div>
            </div>

            <div class="table-container">
                <table id="company-table">
                    <thead>
                        <tr>
                            <th width="30%" data-sort="name">Company Name <span class="sort-icon">▼</span></th>
                            <th width="30%" data-sort="email">Email <span class="sort-icon">▼</span></th>
                            <th width="30%" data-sort="url">URL <span class="sort-icon">▼</span></th>
                            <th class="actions-col">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="footer-info">
            <span id="company-count">Showing 0 of 0 companies</span>
        </div>
    </div>

    <script>
        // Sample data for initial display
        let companies = [
            {
                id: 1,
                name: 'Acme Corporation',
                email: 'info@acme.com',
                url: 'https://www.acme.com'
            },
            {
                id: 2,
                name: 'Globex Industries',
                email: 'sales@globex.com',
                url: 'https://www.globex.com'
            },
            {
                id: 3,
                name: 'Stark Enterprises',
                email: 'hello@stark.com',
                url: 'https://www.stark.com'
            },
            {
                id: 4,
                name: 'Wayne Technologies',
                email: 'contact@waynetech.com',
                url: 'https://www.waynetech.com'
            }
        ];

        // DOM Elements
        const companyTable = document.getElementById('company-table');
        const companyTableBody = companyTable.querySelector('tbody');
        const companyCountElement = document.getElementById('company-count');
        const searchInput = document.getElementById('search-input');
        const importBtn = document.getElementById('import-btn');
        const exportBtn = document.getElementById('export-btn');

        // Sorting variables
        let sortColumn = 'name';
        let sortDirection = 'asc';

        // Function to sort data
        function sortData() {
            // Filter data based on search input
            const searchTerm = searchInput.value.toLowerCase();
            const filteredCompanies = companies.filter(company =>
                company.name.toLowerCase().includes(searchTerm) ||
                company.email.toLowerCase().includes(searchTerm) ||
                company.url.toLowerCase().includes(searchTerm)
            );

            // Sort the filtered data
            filteredCompanies.sort((a, b) => {
                const aValue = a[sortColumn] || '';
                const bValue = b[sortColumn] || '';

                if (sortDirection === 'asc') {
                    return aValue.localeCompare(bValue);
                } else {
                    return bValue.localeCompare(aValue);
                }
            });

            populateTable(filteredCompanies);
        }

        // Function to populate the table with Partners-style inline editing
        function populateTable(data) {
            companyTableBody.innerHTML = '';
            let visibleCount = 0;

            // Add new company row (initially hidden)
            const addRow = document.createElement('tr');
            addRow.className = 'company-add-row';
            addRow.id = 'company-add-row';

            const nameCell = document.createElement('td');
            nameCell.innerHTML = `<input type="text" class="company-edit-input" id="new-company-name" placeholder="Enter company name">`;

            const emailCell = document.createElement('td');
            emailCell.innerHTML = `<input type="email" class="company-edit-input" id="new-company-email" placeholder="Enter email">`;

            const urlCell = document.createElement('td');
            urlCell.innerHTML = `<input type="text" class="company-edit-input" id="new-company-url" placeholder="Enter URL">`;

            const actionsCell = document.createElement('td');
            actionsCell.innerHTML = `
                        <button class="company-btn-save" onclick="saveNewCompany()" title="Save">
                            <i class="fas fa-check"></i>
                        </button>
                        <button class="company-btn-cancel" onclick="cancelAddCompany()" title="Cancel">
                            <i class="fas fa-times"></i>
                        </button>
                    `;

            addRow.appendChild(nameCell);
            addRow.appendChild(emailCell);
            addRow.appendChild(urlCell);
            addRow.appendChild(actionsCell);
            companyTableBody.appendChild(addRow);

            // Add existing companies
            data.forEach(company => {
                const row = document.createElement('tr');
                row.setAttribute('data-id', company.id);

                // Company Name cell
                const nameCell = document.createElement('td');

                // View mode
                const nameSpan = document.createElement('span');
                nameSpan.className = 'company-name';
                nameSpan.textContent = company.name;
                nameCell.appendChild(nameSpan);

                // Edit mode
                const nameEditDiv = document.createElement('div');
                nameEditDiv.className = 'company-name-edit';
                nameEditDiv.innerHTML = `<input type="text" class="company-edit-input" value="${company.name}">`;
                nameCell.appendChild(nameEditDiv);

                row.appendChild(nameCell);

                // Email cell
                const emailCell = document.createElement('td');

                // View mode
                const emailSpan = document.createElement('span');
                emailSpan.className = 'company-email';
                emailSpan.textContent = company.email || '';
                emailCell.appendChild(emailSpan);

                // Edit mode
                const emailEditDiv = document.createElement('div');
                emailEditDiv.className = 'company-email-edit';
                emailEditDiv.innerHTML = `<input type="email" class="company-edit-input" value="${company.email || ''}">`;
                emailCell.appendChild(emailEditDiv);

                row.appendChild(emailCell);

                // URL cell
                const urlCell = document.createElement('td');

                // View mode
                const urlSpan = document.createElement('span');
                urlSpan.className = 'company-url';
                urlSpan.textContent = company.url || '';
                urlCell.appendChild(urlSpan);

                // Edit mode
                const urlEditDiv = document.createElement('div');
                urlEditDiv.className = 'company-url-edit';
                urlEditDiv.innerHTML = `<input type="text" class="company-edit-input" value="${company.url || ''}">`;
                urlCell.appendChild(urlEditDiv);

                row.appendChild(urlCell);

                // Actions cell
                const actionsCell = document.createElement('td');
                actionsCell.className = 'actions-cell';

                // Regular action buttons
                const actionButtons = document.createElement('div');
                actionButtons.className = 'action-buttons';
                actionButtons.innerHTML = `
                            <button class="btn-edit" onclick="editCompany(${company.id})" title="Edit Company">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-delete" onclick="deleteCompany(${company.id})" title="Delete Company">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        `;
                actionsCell.appendChild(actionButtons);

                // Edit action buttons
                const editActions = document.createElement('div');
                editActions.className = 'company-edit-actions';
                editActions.innerHTML = `
                            <button class="company-btn-save" onclick="saveCompany(${company.id})" title="Save">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="company-btn-cancel" onclick="cancelEdit(${company.id})" title="Cancel">
                                <i class="fas fa-times"></i>
                            </button>
                        `;
                actionsCell.appendChild(editActions);

                row.appendChild(actionsCell);
                companyTableBody.appendChild(row);
                visibleCount++;
            });

            // Update the company count
            companyCountElement.textContent = `Showing ${visibleCount} of ${companies.length} companies`;
        }

        // Inline add new company functions
        function showAddRow() {
            const addRow = document.getElementById('company-add-row');
            if (addRow) {
                addRow.classList.add('active');
                const nameInput = document.getElementById('new-company-name');
                if (nameInput) {
                    nameInput.focus();
                }
            }
        }

        function saveNewCompany() {
            const nameInput = document.getElementById('new-company-name');
            const emailInput = document.getElementById('new-company-email');
            const urlInput = document.getElementById('new-company-url');

            const name = nameInput ? nameInput.value.trim() : '';
            const email = emailInput ? emailInput.value.trim() : '';
            const url = urlInput ? urlInput.value.trim() : '';

            if (!name) {
                alert('Company name cannot be empty');
                if (nameInput) nameInput.focus();
                return;
            }

            // Add to local data
            const newId = companies.length > 0 ? Math.max(...companies.map(c => c.id)) + 1 : 1;
            const newCompany = { id: newId, name: name, email: email, url: url };

            companies.push(newCompany);

            // Reset add row
            if (nameInput) nameInput.value = '';
            if (emailInput) emailInput.value = '';
            if (urlInput) urlInput.value = '';
            const addRow = document.getElementById('company-add-row');
            if (addRow) addRow.classList.remove('active');

            // Refresh table
            sortData();

            // TODO: Backend logic to save to database
            console.log('Added new company:', newCompany);
        }

        function cancelAddCompany() {
            const nameInput = document.getElementById('new-company-name');
            const emailInput = document.getElementById('new-company-email');
            const urlInput = document.getElementById('new-company-url');

            if (nameInput) nameInput.value = '';
            if (emailInput) emailInput.value = '';
            if (urlInput) urlInput.value = '';

            const addRow = document.getElementById('company-add-row');
            if (addRow) addRow.classList.remove('active');
        }
        // Partners-style edit functions
        function editCompany(id) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) return;

            row.classList.add('company-edit-row');
            const nameInput = row.querySelector('.company-name-edit .company-edit-input');
            if (nameInput) {
                nameInput.focus();
                nameInput.select();
            }
        }

        function saveCompany(id) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) return;

            const nameInput = row.querySelector('.company-name-edit .company-edit-input');
            const emailInput = row.querySelector('.company-email-edit .company-edit-input');
            const urlInput = row.querySelector('.company-url-edit .company-edit-input');

            const newName = nameInput ? nameInput.value.trim() : '';
            const newEmail = emailInput ? emailInput.value.trim() : '';
            const newUrl = urlInput ? urlInput.value.trim() : '';

            if (!newName) {
                alert('Company name cannot be empty');
                if (nameInput) nameInput.focus();
                return;
            }

            // Update local data
            const companyIndex = companies.findIndex(c => c.id === id);
            if (companyIndex !== -1) {
                companies[companyIndex].name = newName;
                companies[companyIndex].email = newEmail;
                companies[companyIndex].url = newUrl;
            }

            // Update display
            const nameSpan = row.querySelector('.company-name');
            const emailSpan = row.querySelector('.company-email');
            const urlSpan = row.querySelector('.company-url');

            if (nameSpan) nameSpan.textContent = newName;
            if (emailSpan) emailSpan.textContent = newEmail;
            if (urlSpan) urlSpan.textContent = newUrl;

            // Remove edit class
            row.classList.remove('company-edit-row');

            // TODO: Backend logic to save to database
            console.log(`Updated company ${id}:`, { name: newName, email: newEmail, url: newUrl });
        }

        function cancelEdit(id) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) return;

            // Get original data
            const company = companies.find(c => c.id === id);
            if (!company) return;

            // Reset input values to original
            const nameInput = row.querySelector('.company-name-edit .company-edit-input');
            const emailInput = row.querySelector('.company-email-edit .company-edit-input');
            const urlInput = row.querySelector('.company-url-edit .company-edit-input');

            if (nameInput) nameInput.value = company.name;
            if (emailInput) emailInput.value = company.email || '';
            if (urlInput) urlInput.value = company.url || '';

            // Remove edit class
            row.classList.remove('company-edit-row');
        }

        // Function to delete a company
        function deleteCompany(id) {
            if (confirm('Are you sure you want to delete this company?')) {
                companies = companies.filter(company => company.id !== id);
                sortData();
            }
        }

        // Function to initialize the table sortable headers
        function initializeSortableHeaders() {
            const headers = companyTable.querySelectorAll('th[data-sort]');

            headers.forEach(header => {
                header.addEventListener('click', () => {
                    const column = header.getAttribute('data-sort');

                    // Toggle sort direction if clicking the same column
                    if (sortColumn === column) {
                        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortColumn = column;
                        sortDirection = 'asc';
                    }

                    // Update visual indicators
                    headers.forEach(h => h.classList.remove('active-sort'));
                    header.classList.add('active-sort');

                    const sortIcon = header.querySelector('.sort-icon');
                    sortIcon.textContent = sortDirection === 'asc' ? '▲' : '▼';

                    sortData();
                });
            });
        }

        // Modal functions (only for adding new companies)
        function openAddModal() {
            modalTitle.textContent = 'Add New Company';
            companyForm.reset();
            companyIdInput.value = '';
            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function saveCompanyModal(event) {
            event.preventDefault();

            const companyData = {
                name: companyNameInput.value,
                email: companyEmailInput.value,
                url: companyUrlInput.value
            };

            const companyId = companyIdInput.value;

            if (companyId) {
                // Update existing company
                const companyIndex = companies.findIndex(c => c.id == companyId);
                if (companyIndex !== -1) {
                    companies[companyIndex] = { ...companies[companyIndex], ...companyData };
                }
            } else {
                // Add new company
                const newId = companies.length > 0 ? Math.max(...companies.map(c => c.id)) + 1 : 1;
                companies.push({
                    id: newId,
                    ...companyData
                });
            }

            closeModal();
            sortData();
        }

        // Function to handle CSV import
        function importCSV() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.csv';

            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const contents = e.target.result;
                    const lines = contents.split('\n');

                    // Skip header row and process data
                    const newCompanies = [];
                    let maxId = companies.length > 0 ? Math.max(...companies.map(c => c.id)) : 0;

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const fields = line.split(',');
                        if (fields.length < 3) continue;

                        maxId++;
                        newCompanies.push({
                            id: maxId,
                            name: fields[0].trim(),
                            email: fields[1].trim(),
                            url: fields[2].trim()
                        });
                    }

                    companies = [...companies, ...newCompanies];
                    sortData();
                };

                reader.readAsText(file);
            });

            fileInput.click();
        }

        // Function to export to CSV
        function exportCSV() {
            const headers = ['Company Name', 'Email', 'URL'];
            const rows = companies.map(company => [
                company.name,
                company.email,
                company.url
            ]);

            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.setAttribute('href', url);
            link.setAttribute('download', 'company_data.csv');
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Event Listeners
        importBtn.addEventListener('click', importCSV);
        exportBtn.addEventListener('click', exportCSV);

        searchInput.addEventListener('input', () => {
            sortData();
        });

        // Initialize
        initializeSortableHeaders();
        sortData();
    </script>
</body>
</html>
